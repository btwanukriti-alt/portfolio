<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SSH client Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap">
<style>
/* Screening room: dark neutral page around the 16:9 stage. Single deliberate dark look. */
:root{--page:#08080C;--panel:#14131B;--line:#272533;--text:#E9E7F2;--dim:#8C88A0;--accent:#9B6BFF;color-scheme:dark}
html,body{height:100%}
body{background:var(--page);color:var(--text);font-family:'Outfit',ui-sans-serif,system-ui,sans-serif;margin:0}
#root{min-height:100%;display:flex;align-items:center;justify-content:center;padding-inline:16px;padding-block:24px;box-sizing:border-box}
.player{width:min(100%, calc((100vh - 120px) * 16 / 9));min-width:0;display:flex;flex-direction:column;gap:14px}
.frame{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;overflow:hidden;border-radius:14px;background:#000;box-shadow:0 0 0 1px #1c1b25,0 30px 80px -30px rgba(0,0,0,.8)}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.controls button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);display:grid;place-items:center;cursor:pointer}
.controls button:hover{border-color:var(--accent)}
.controls button:focus-visible,.bar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{position:relative;flex:1 1 200px;min-width:0;height:6px;border-radius:3px;background:var(--line);cursor:pointer;touch-action:none}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.tick{position:absolute;top:-3px;width:2px;height:12px;border-radius:1px;background:var(--dim);opacity:.5}
.time{font-size:13px;font-variant-numeric:tabular-nums;color:var(--dim);min-width:84px;text-align:right}
.hint{font-size:12px;color:var(--dim);width:100%}
@media (max-width:600px){.hint{display:none}}
</style>
</head><body>
