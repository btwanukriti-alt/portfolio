<script>
// The corner shapes, as the gym card lays them out: [kind, x, y (share of the frame), size, colour].
// Sizes are shares of the frame's longer side. With W and H the frame is in px; without, the
// shapes size to the page (vmax) and sit by percentage.
window.__SHAPES = function (set, W, H) {
  var SETS = {
    jaadu: [['circle', .05, .92, .3, '#B8EDD6'], ['pill', .94, .13, [.26, .09], '#FFE07A'], ['star', .93, .86, .1, '#7D95FF'], ['ring', .07, .12, .13, 'rgba(255,255,255,.75)']],
    fitness: [['circle', .05, .92, .3, '#DCCFFF'], ['pill', .94, .13, [.26, .09], '#FFE07A'], ['star', .93, .86, .1, '#FF86A8'], ['ring', .07, .12, .13, 'rgba(255,255,255,.85)']],
    clihub: [['circle', .05, .92, .3, '#CDBFFF'], ['pill', .94, .13, [.26, .09], '#FFE07A'], ['star', .93, .86, .1, '#7B61FF'], ['ring', .07, .12, .13, 'rgba(255,255,255,.8)']],
    college: [['circle', .05, .92, .3, '#BFD0FF'], ['pill', .94, .13, [.26, .09], '#A6E5C8'], ['star', .93, .86, .1, '#FF8A5B'], ['ring', .07, .12, .13, 'rgba(255,255,255,.85)']]
  };
  var px = W != null, M = px ? Math.max(W, H) : 0;
  var u = function (v) { return px ? v * M + 'px' : v * 100 + 'vmax' };
  var STAR = 'M50 2 61 34 96 36 68 57 79 92 50 71 21 92 32 57 4 36 39 34z';
  return (SETS[set] || []).map(function (s, i) {
    var kind = s[0], size = s[3], c = s[4];
    var st = {
      left: px ? s[1] * W + 'px' : s[1] * 100 + '%',
      top: px ? s[2] * H + 'px' : s[2] * 100 + '%',
      transform: 'translate(-50%,-50%)',
      '--dx': (i % 2 ? -1 : 1) * 0.7 + (px ? '%' : 'vmax'),
      '--dy': (i % 2 ? 1 : -1) * 0.6 + (px ? '%' : 'vmax'),
      animationDelay: -i * 2.9 + 's'
    };
    if (kind === 'circle') return { tag: 'div', props: { className: 'shp', style: Object.assign(st, { width: u(size), height: u(size), borderRadius: '50%', background: c }) } };
    if (kind === 'ring') return { tag: 'div', props: { className: 'shp', style: Object.assign(st, { width: u(size), height: u(size), borderRadius: '50%', border: u(size * 0.12) + ' solid ' + c, boxSizing: 'border-box' }) } };
    if (kind === 'pill') return { tag: 'div', props: { className: 'shp', style: Object.assign(st, { width: u(size[0]), height: u(size[1]), borderRadius: u(size[1]), background: c }) } };
    return { tag: 'svg', props: { className: 'shp', viewBox: '0 0 100 100', style: Object.assign(st, { width: u(size), height: u(size), overflow: 'visible' }), dangerouslySetInnerHTML: { __html: '<path d="' + STAR + '" fill="' + c + '"/>' } } };
  });
};
</script>

const { useState, useEffect, useRef } = React
const h = React.createElement
// BASE is the authored timeline; PACE stretches it so every move and hold plays slower.
// A frame taller than wide gets the portrait cut: the same scenes re-laid on a 1080 x 1920 stage
// (P(landscape, portrait) picks each position). Turning the frame the other way reloads the page.
const PORTRAIT = innerHeight > innerWidth
const P = (land, port) => (PORTRAIT ? port : land)
addEventListener('resize', () => { if ((innerHeight > innerWidth) !== PORTRAIT) location.reload() })
const BASE = 22.8, PACE = 1.36, DURATION = 31, W = P(1920, 1080), H = P(1080, 1920)
const FONT = "'Public Sans', system-ui, sans-serif"
const APP = "'Poppins', system-ui, sans-serif"

// Studio + caption tokens (College Management) and app tokens (Zync).
const C = {
  ink: '#1C252E', sub: '#637381', mute: '#919EAB', line: '#E9EDF2', blue: '#1877F2',
  green: '#00A76F', greenL: '#5BE49B', amber: '#FFAB00',
}
const Z = {
  ink: '#111111', sub: '#6F6F7A', mute: '#A3A3AE', bg: '#F5F4FA', card: '#FFFFFF', line: '#ECEBF3',
  purple: '#6650D0', purpleL: '#EEEAFE', purpleMid: '#9E8CF0', pink: '#F2577A', pinkL: '#FDE3EA',
  water: '#5B8DEF', waterL: '#E4ECFD', sleep1: '#3D3B8E', sleep2: '#A21CC4', green: '#1F9D63',
  teal: '#55CFA8', amber: '#FFB800', violet: '#C85BD3',
}

const clamp = (e, a = 0, b = 1) => Math.max(a, Math.min(b, e))
const ease = (e) => (e < 0.5 ? 4 * e * e * e : 1 - Math.pow(-2 * e + 2, 3) / 2)
const ramp = (e, a, b) => ease(clamp((e - a) / (b - a)))
const lerp = (a, b, k) => a + (b - a) * k
const seq = (e, k) => {
  if (e <= k[0][0]) return k[0][1]
  for (let n = 0; n < k.length - 1; n++) {
    const [i, o] = k[n], [a, s] = k[n + 1]
    if (e <= a) return lerp(o, s, ramp(e, i, a))
  }
  return k[k.length - 1][1]
}
const env = (e, s, end, i = 0.6, o = 0.5) => {
  const a = ramp(e, s, s + i), b = ramp(e, end - o, end)
  return { op: a * (1 - b), y: (1 - a) * 60 - b * 30, tilt: (1 - a) * 6, i: a, o: b }
}
const fmt = (n) => Math.round(n).toLocaleString('en-US')

// ---------- Studio vocabulary (College Management layout on a flat cream canvas) ----------

// Flat cream canvas, no gradients or shapes.
function Studio() {
  return h('div', { style: { position: 'absolute', inset: 0, overflow: 'hidden', background: '#FFE8EE' } },
    ...window.__SHAPES('fitness', W, H).map((p, i) => h(p.tag, { ...p.props, key: i })),
    h('svg', { width: W, height: H, style: { position: 'absolute', inset: 0, opacity: 0.05, mixBlendMode: 'multiply' } },
      h('filter', { id: 'gr' }, h('feTurbulence', { type: 'fractalNoise', baseFrequency: '0.85', numOctaves: '2', seed: '3' })),
      h('rect', { width: W, height: H, filter: 'url(#gr)' })),
  )
}

function Headline({ t, s, e, eyebrow, title }) {
  const a = ramp(t, s, s + 0.6), b = ramp(t, s + 0.12, s + 0.75), o = ramp(t, e - 0.45, e)
  return h('div', { style: { position: 'absolute', top: P(70, 250), left: P(0, 70), right: P(0, 70), textAlign: 'center', fontFamily: FONT } },
    h('div', { style: { fontSize: 20, letterSpacing: '0.16em', textTransform: 'uppercase', fontWeight: 600, color: C.sub, opacity: a * (1 - o), transform: `translateY(${(1 - a) * 20 - o * 16}px)` } }, eyebrow),
    h('div', { style: { marginTop: 14, fontSize: P(60, 68), lineHeight: 1.08, textWrap: 'balance', fontWeight: 600, letterSpacing: '-0.03em', color: '#0B1B33', opacity: b * (1 - o), transform: `translateY(${(1 - b) * 30 - o * 20}px)` } }, title),
  )
}

function Cursor({ t, keys, clicks, show }) {
  const x = seq(t, keys.map((k) => [k[0], k[1]])), y = seq(t, keys.map((k) => [k[0], k[2]]))
  let s = 1
  clicks.forEach((c) => {
    const g = t - c
    if (g > -0.12 && g < 0.22) s = Math.min(s, g < 0 ? 1 - ((g + 0.12) / 0.12) * 0.18 : 0.82 + (g / 0.22) * 0.18)
  })
  const rings = clicks.map((c, i) => {
    const g = t - c
    if (g < 0 || g > 0.6) return null
    const k = ease(g / 0.6)
    return h('circle', { key: i, cx: 6, cy: 4, r: 8 + k * 26, fill: 'none', stroke: 'rgba(24,119,242,0.5)', strokeWidth: 2, opacity: 1 - k })
  })
  return h('svg', { width: 80, height: 80, style: { position: 'absolute', left: x - 6, top: y - 4, opacity: show, overflow: 'visible', zIndex: 50, transform: `scale(${s})`, transformOrigin: '6px 4px', filter: 'drop-shadow(0 6px 10px rgba(0,0,0,0.28))' } },
    rings,
    h('path', { d: 'M6 4 L6 34 L14 26 L20 40 L26 37 L20 24 L31 24 Z', fill: '#fff', stroke: '#111', strokeWidth: '1.6', strokeLinejoin: 'round' }),
  )
}

function Callout({ t, s, e, x, y, side = 'left', w = 330, pad = '22px 24px', children }) {
  const a = ramp(t, s, s + 0.6), o = ramp(t, e - 0.45, e), dx = (1 - a) * (side === 'left' ? -40 : 40)
  return h('div', { style: { position: 'absolute', left: x, top: y, width: w, opacity: a * (1 - o), zIndex: 40, transform: `translate(${dx}px, ${(1 - a) * 30 - o * 24}px)`, fontFamily: APP, color: Z.ink, background: 'rgba(255,255,255,0.96)', borderRadius: 20, padding: pad, boxSizing: 'border-box', border: '1px solid rgba(255,255,255,0.9)', boxShadow: '0 30px 60px -12px rgba(11,42,91,0.28), 0 8px 18px rgba(11,42,91,0.08)' } }, children)
}

// Dashed + drawn connector between two points, as in the Fee collection scene.
function Link({ k, op = 1, from: [x1, y1], to: [x2, y2], bend = 70 }) {
  const d = `M${x1},${y1} C${x1 + bend},${y1} ${x2 - bend},${y2} ${x2},${y2}`
  return h('svg', { width: W, height: H, style: { position: 'absolute', inset: 0, opacity: op, zIndex: 30, pointerEvents: 'none' } },
    h('path', { d, fill: 'none', stroke: C.blue, strokeWidth: 2, strokeDasharray: '6 6', opacity: k }),
    h('path', { d, fill: 'none', stroke: C.blue, strokeWidth: 2.5, pathLength: 1, strokeDasharray: 1, strokeDashoffset: 1 - k }),
    h('circle', { cx: x1, cy: y1, r: 5 * k, fill: C.blue }),
    h('circle', { cx: x2, cy: y2, r: 5 * k, fill: C.blue }),
  )
}

// Each scene keeps its own clock: IN is the extra hold on the opener, SHIFT also covers the
// longer daily-log scene.
const IN = 0.8, SHIFT = 1.4 + IN
function Intro({ t }) { return h(Trackers, { t, s0: 0, end: 4.5, out: ramp(t, 3.95, 4.5) }) }
function Outro({ t }) { return h(Trackers, { t, s0: 18.4 + IN, end: BASE, out: ramp(t, BASE - 0.5, BASE) }) }

function Frame({ t }) {
  return h('div', { style: { position: 'absolute', inset: 0, overflow: 'hidden' } },
    h(Studio),
    t < 4.6 && h(Intro, { t }),
    t > 3.5 + IN && t < 9.6 + IN && h(LogScene, { t: t - IN }),
    t > 9.3 + IN && t < 13 + SHIFT && h(WorkoutScene, { t: t - SHIFT }),
    t > 12.4 + SHIFT && t < 17.4 + SHIFT && h(GymScene, { t: t - SHIFT }),

// ---------- Player (same controls and window.__zync API as the other cuts) ----------

const SCENE_TICKS = [4.4, 10.2, 14.8, 19.4].map((k) => k * PACE)
const btn = { width: 36, height: 36, borderRadius: 18, border: '1px solid #39445a', background: '#151b26', color: '#fff', cursor: 'pointer', fontSize: 13 }
function Player() {
  const [t, setT] = useState(0), [playing, setPlaying] = useState(true), [bare, setBare] = useState(false), [s, setS] = useState(1)
  const tr = useRef(0), pr = useRef(true), last = useRef(null)
  useEffect(() => { tr.current = t }, [t])
  useEffect(() => { pr.current = playing }, [playing])
  useEffect(() => {
    const fit = () => setS(Math.min(window.innerWidth / W, (window.innerHeight - (bare ? 0 : 64)) / H))
    fit(); window.addEventListener('resize', fit)
    return () => window.removeEventListener('resize', fit)
  }, [bare])
  useEffect(() => {
    let raf
    const tick = (now) => {
      if (last.current == null) last.current = now
      const dt = (now - last.current) / 1000
      last.current = now
      if (pr.current) {
        let n = tr.current + dt
        if (n >= DURATION) { n = DURATION; setPlaying(false) }
        tr.current = n; setT(n)
      }
      raf = requestAnimationFrame(tick)
    }
    raf = requestAnimationFrame(tick)
    return () => cancelAnimationFrame(raf)
  }, [])
  useEffect(() => {
    const key = (e) => {
      if (e.code === 'Space') { e.preventDefault(); if (tr.current >= DURATION) { tr.current = 0; setT(0) } setPlaying((p) => !p) }
      if (e.key === 'r' || e.key === 'R') { tr.current = 0; setT(0); setPlaying(true) }
      if (e.key === 'ArrowRight') { const n = Math.min(DURATION, tr.current + 1); tr.current = n; setT(n) }
      if (e.key === 'ArrowLeft') { const n = Math.max(0, tr.current - 1); tr.current = n; setT(n) }
      if (e.key === 'h' || e.key === 'H') setBare((b) => !b)
    }
    window.addEventListener('keydown', key)
    window.__zync = { seek: (p) => { tr.current = p; setT(p) }, pause: () => setPlaying(false), play: () => setPlaying(true), duration: DURATION }
    return () => window.removeEventListener('keydown', key)
  }, [])
  const scrub = (e) => { const r = e.currentTarget.getBoundingClientRect(), n = clamp((e.clientX - r.left) / r.width) * DURATION; tr.current = n; setT(n) }
  return h('div', { style: { position: 'fixed', inset: 0, background: '#FFE8EE', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', fontFamily: FONT } },
    h('div', { style: { width: W * s, height: H * s, position: 'relative', overflow: 'hidden' } },
      h('div', { style: { width: W, height: H, transform: `scale(${s})`, transformOrigin: '0 0', position: 'absolute' } }, h(Frame, { t: Math.min(BASE, t / PACE) }))),
    !bare && h('div', { style: { width: Math.min(W * s, 1200), height: 64, display: 'flex', alignItems: 'center', gap: 14, padding: '0 16px', boxSizing: 'border-box', color: '#cfd6e4' } },
      h('button', { onClick: () => { if (t >= DURATION) { tr.current = 0; setT(0) } setPlaying(!playing) }, style: btn }, playing ? '❚❚' : '▶'),
      h('button', { onClick: () => { tr.current = 0; setT(0); setPlaying(true) }, style: btn }, '↺'),
      h('div', { onClick: scrub, style: { flex: 1, height: 6, borderRadius: 3, background: '#2a3242', position: 'relative', cursor: 'pointer' } },
        h('div', { style: { width: `${(t / DURATION) * 100}%`, height: '100%', borderRadius: 3, background: '#1877F2' } }),
        SCENE_TICKS.map((k) => h('div', { key: k, style: { position: 'absolute', left: `${(k / DURATION) * 100}%`, top: -3, width: 2, height: 12, background: '#6b7a93' } }))),
      h('div', { style: { fontSize: 13, width: 92, textAlign: 'right', fontVariantNumeric: 'tabular-nums' } }, t.toFixed(1), ' / ', DURATION, 's'),
      h('div', { style: { fontSize: 11, color: '#6b7a93' } }, 'H hides')))
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Player, null))

<script>(function(){
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let ready=false,want=false,pos=0,since=0,timer=0;
const z=()=>window.__zync;
const play=()=>{want=true;if(!ready||still)return;clearTimeout(timer);z().seek(pos);z().play();since=performance.now();timer=setTimeout(()=>{pos=0;play()},(z().duration-pos)*1000)};
const pause=()=>{if(ready&&want){pos=(pos+(performance.now()-since)/1000)%z().duration;z().pause();clearTimeout(timer)}want=false};
const init=()=>{if(!z())return setTimeout(init,50);
dispatchEvent(new KeyboardEvent("keydown",{key:"h",code:"KeyH"}));
pos=z().duration*(still?0.3:0.05);z().pause();z().seek(pos);ready=true;if(want){want=false;play()}};
addEventListener("message",e=>{if(e.data==="showcase:play")play();else if(e.data==="showcase:pause")pause()});
init();
})()</script></body></html>
