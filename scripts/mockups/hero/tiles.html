<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Montserrat:wght@700&display=swap"><style>
body{margin:0;background:transparent}
.tile{position:relative;width:900px;height:600px;overflow:hidden;margin:0 0 20px}
.tile.pop{overflow:visible}
.gr{position:absolute;inset:0;background-size:cover}
.cs{position:absolute;height:44px;border-radius:50%;background:radial-gradient(closest-side,rgba(10,8,30,.45),rgba(10,8,30,0));filter:blur(6px)}
.dev{position:absolute;display:block}
.scr.dk{background:linear-gradient(160deg,#3A3170,#16132E);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22)}
.scr.lt{background:rgba(255,255,255,.92);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,1)}
.scr .sc{border-radius:11px;background-size:100% auto;background-position:top center;background-repeat:no-repeat}
.scr.lt .sc{box-shadow:0 0 0 1px rgba(20,23,31,.08)}
.phone{background:#0B0C10;box-shadow:inset 0 0 0 2px #34363F;box-sizing:border-box}
.psc{position:relative;width:100%;height:100%;background-size:100% auto;background-position:top center;background-repeat:no-repeat;background-color:#fff;overflow:hidden}
.isl{position:absolute;left:50%;background:#000;border-radius:99px}
</style></head><body><div id="root"></div><script src="tiles.js"></script><script>
const mode=new URLSearchParams(location.search).get('mode')||'full'
root.innerHTML=TILESPEC.map(t=>buildTile(t,mode)).join('')
</script></body></html>
