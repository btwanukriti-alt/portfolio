<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Geist;font-weight:400;src:url(node_modules/@fontsource/geist/files/geist-latin-400-normal.woff2)}
@font-face{font-family:Geist;font-weight:500;src:url(node_modules/@fontsource/geist/files/geist-latin-500-normal.woff2)}
body{margin:0;background:#fff}
.pg{position:relative;width:1600px;overflow:hidden;margin:0 0 60px;background:#B0C1CE;font-family:Geist,sans-serif}
.t{position:absolute;overflow:hidden;border-radius:36px;background:#00022B;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.1)}
.t .cap{position:absolute;left:18px;right:18px;bottom:18px;z-index:4;border-radius:26px;background:#1A3796;padding:30px 32px;box-sizing:border-box}
.t .cap h3{margin:0;font:400 34px/1.1 Geist;color:#EEF2FA;letter-spacing:-.02em}
.t .cap p{margin:12px 0 0;font:400 19px/1.5 Geist;color:#C9D6F5;max-width:560px}
.t .fade{position:absolute;left:0;right:0;bottom:0;z-index:3;background:linear-gradient(180deg,rgba(0,2,43,0),#00022B 62%)}
.c{position:absolute;z-index:2;display:block;border-radius:18px}
.glow{position:absolute;z-index:2;border-radius:30px;padding:16px;background:linear-gradient(135deg,#7FB6FF,#3D6BFF 40%,#2346C8)}
.glow img{display:block;border-radius:16px}
.ghost{position:absolute;z-index:1;border-radius:32px;border:2px solid rgba(255,255,255,.14);background:rgba(255,255,255,.02)}
.wide .side{position:absolute;left:18px;top:18px;bottom:18px;width:480px;box-sizing:border-box;padding:56px 48px;border-radius:26px;background:#1A3796;display:flex;flex-direction:column;justify-content:flex-end}
.wide .side h3{margin:0;font:400 50px/1.12 Geist;color:#EEF2FA;letter-spacing:-.025em}
.wide .side p{margin:20px 0 0;font:400 21px/1.55 Geist;color:#C9D6F5}
.stackbar{position:absolute;z-index:1;border-radius:0 0 22px 22px;background:#22304F;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.gb{position:absolute;z-index:2;padding:14px;border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.04) 45%,rgba(130,170,255,.10));backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.gb::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.6px;pointer-events:none;background:linear-gradient(135deg,#fff 0%,#9fdcff 14%,rgba(110,160,255,.28) 42%,rgba(110,160,255,.08) 62%,#6f8dff 86%,#d2c4ff 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.gb img{display:block;border-radius:17px}
</style>
<div id="root"></div>
<script>
const F='feat/'
const P=(id,h,inner)=>`<div class="pg" id="${id}" style="height:${h}px">${inner}</div>`
const T=(l,t,w,h,inner,title,body,cap=210)=>`<div class="t" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px"><div style="position:absolute;left:0;top:0;right:0;height:${h-cap}px;overflow:hidden">${inner}</div><div class="cap"><h3>${title}</h3><p>${body}</p></div></div>`
const im=(n,w,l,t,r=18)=>`<img class="c" src="${F}${n}.png" style="left:${l}px;top:${t}px;width:${w}px;border-radius:${r}px">`
const cursor=(l,t)=>`<svg style="position:absolute;left:${l}px;top:${t}px;z-index:3;" width="46" height="50" viewBox="0 0 20 22"><path d="M2 1.5l15 8.2-6.6 1.6-3.2 6.4z" fill="#FFFFFF" stroke="#16202F" stroke-width="1.2" stroke-linejoin="round"/></svg>`
const S=[]
// Page 1: footprint (stacked frames, glow) + regime, then alerts, strategy card, chart prompt
S.push(P('p1',1440,
 T(40,40,1520,720,
   `<div class="ghost" style="left:110px;top:58px;width:1500px;height:700px"></div><div class="ghost" style="left:80px;top:88px;width:1500px;height:700px"></div>`+
   `<div class="glow" style="left:50px;top:108px"><img src="${F}fp.png" style="width:1500px"></div>`,
   'Footprint chart','Each candle splits into price bins, with the volume traded in each.',210)+
 T(40,780,500,620,im('c-alert',1300,40,90,14),'Multi-condition alerts','Price, POC, footprint and regime, firing only when all of them hold.',230)+
 T(560,780,480,620,`<div class="stackbar" style="left:90px;top:520px;width:300px;height:26px"></div><div class="stackbar" style="left:70px;top:498px;width:340px;height:26px;background:#2B3B60"></div>`+im('card1',380,50,80,22),'Strategy cards','Win rate, drawdown and equity curve for every strategy.',200)+
 T(1060,780,500,620,im('c-prompt-typing',560,40,120,26)+im('c-prompt-suggested',560,40,270,26)+cursor(340,330),'Ask the chart','Tap any point and ask why price moved there.',200)))
// Page 2: wide Overnight Discoveries, then comparison + deja vu
S.push(P('p2',1220,
 `<div class="t wide" style="left:40px;top:40px;width:1520;width:1520px;height:560px"><div class="side"><h3>Set it up. Wake up to a shortlist.</h3><p>Quant Lab tests hundreds of strategies overnight. Only the survivors reach your morning list.</p></div>${im('funnel-only',940,580,70,24)}</div>`+
 T(40,620,960,560,im('cmp',1300,40,60,18),'Strategy comparison','Five metrics side by side, the best in each column highlighted.',200)+
 T(1020,620,540,560,im('deja-outcome',600,40,50,22),'Déjà Vu','Finds look-alike setups in market history and what happened next.',200)))
// Page 3: wide Library
S.push(P('p3',800,
 `<div class="t wide" style="left:40px;top:40px;width:1520px;height:720px"><div class="side"><h3>Every strategy, one library</h3><p>Filter by regime, run a backtest, paper trade or fork, all from the card.</p></div><div class="gb" style="left:520px;top:52px"><img src="${F}library-screen.png" style="width:940px"></div></div>`))
document.getElementById('root').innerHTML=S.join('')
</script>
