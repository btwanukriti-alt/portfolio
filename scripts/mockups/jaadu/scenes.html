<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Geist;font-weight:300;src:url(node_modules/@fontsource/geist/files/geist-latin-300-normal.woff2)}
@font-face{font-family:Geist;font-weight:400;src:url(node_modules/@fontsource/geist/files/geist-latin-400-normal.woff2)}
@font-face{font-family:Geist;font-weight:500;src:url(node_modules/@fontsource/geist/files/geist-latin-500-normal.woff2)}
@font-face{font-family:Geist;font-weight:600;src:url(node_modules/@fontsource/geist/files/geist-latin-600-normal.woff2)}
@font-face{font-family:Geist;font-weight:700;src:url(node_modules/@fontsource/geist/files/geist-latin-700-normal.woff2)}
@font-face{font-family:'IBM Plex Mono';font-weight:400;src:url(node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2)}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url(node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2)}
body{margin:0;background:#fff}
.sc{position:relative;width:1600px;overflow:hidden;font-family:Geist,sans-serif;margin:0 0 60px;background:linear-gradient(180deg,#00010C 0%,#010828 55%,#031042 100%);--cardbg:linear-gradient(180deg,rgba(120,160,255,.13),rgba(255,255,255,.03));--cardbd:rgba(255,255,255,.16);--cardbf:blur(28px) saturate(1.35)}
.arc{position:absolute;border-radius:50%;pointer-events:none}
.arc.ring{background:radial-gradient(closest-side,rgba(0,0,0,0) 97.6%,rgba(110,150,255,.9) 98.6%,rgba(235,244,255,1) 99.2%,rgba(110,150,255,0) 100%)}
.arc.halo{background:radial-gradient(closest-side,rgba(0,0,0,0) 90%,rgba(40,90,255,.5) 97%,rgba(0,0,0,0) 100%);filter:blur(22px)}
.fx{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,rgba(0,0,0,0) 55%,rgba(0,0,10,.55))}
.gl{position:absolute;overflow:hidden;z-index:2;border-radius:44px;background:var(--cardbg);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 40px 80px -30px rgba(0,0,20,.8);backdrop-filter:var(--cardbf);border:1px solid rgba(255,255,255,.14)}
.gl>div{transform-origin:0 0}
.cr2{position:absolute;z-index:2;transform-origin:0 0}
.plane{position:absolute;transform-style:preserve-3d}
</style>
<script src="comp.js"></script>
<div id="root"></div>
<script>
const arcs=(cx,top,d=2400)=>`<div class="arc halo" style="left:${cx-d/2}px;top:${top}px;width:${d}px;height:${d}px"></div><div class="arc ring" style="left:${cx-d/2}px;top:${top}px;width:${d}px;height:${d}px"></div>`
const SC=(id,h,inner,extra='')=>`<div class="sc" id="${id}" style="height:${h}px;${extra}">${inner}<div class="fx"></div></div>`
const at=(html,l,t,k=1)=>`<div class="cr2" style="left:${l}px;top:${t}px;transform:scale(${k})">${html}</div>`
// glass slab that frames a component (like the reference card)
const slab=(html,w,h,k,l,t,pad=36,r=44)=>`<div class="gl" style="left:${l}px;top:${t}px;width:${w*k+pad*2}px;height:${h*k+pad*2}px;border-radius:${r}px"><div style="position:absolute;left:${pad}px;top:${pad}px;transform:scale(${k});transform-origin:0 0;width:${w}px;height:${h}px">${html}</div></div>`
const card=(html,l,t,k=1)=>`<div class="cr2" style="left:${l}px;top:${t}px;transform:scale(${k});box-shadow:0 40px 70px -20px rgba(0,0,20,.8);border-radius:16px">${html}</div>`
// 3D laptop: base plane flat, lid hinged at its back edge
function laptop3d({scr,k=.84,W=1240,D=800,rx=-26,ry=-32,rz=0,lid=14,cx=800,cy=560,sc=1}){
 const sw=1440*k,sh=900*k,LW=sw+28,LH=sh+30
 const keys=`repeating-linear-gradient(90deg,transparent 0 46px,#06070c 46px 50px),repeating-linear-gradient(0deg,transparent 0 46px,#06070c 46px 50px),#1a1c26`
 return `<div style="position:absolute;left:${cx}px;top:${cy}px;width:0;height:0;perspective:2400px;perspective-origin:50% 30%;transform:scale(${sc})"><div class="plane" style="transform:rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)">
 <div class="plane" style="left:${-W*1.1}px;top:${-D*.1}px;width:${W*2.2}px;height:${D*1.4}px;transform:translateY(24px) rotateX(90deg);border-radius:260px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,rgba(0,0,0,.05) 2px 4px),linear-gradient(180deg,#3B4BA8,#17226B 60%,#0A1148);box-shadow:0 0 120px 20px rgba(30,60,200,.35)"></div>
 <div class="plane" style="left:${-W/2}px;top:0;width:${W}px;height:${D}px;transform:rotateX(90deg);border-radius:0 0 34px 34px;background:linear-gradient(180deg,#B9BECE,#D9DCE6 30%,#C5CAD8);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55),0 30px 60px rgba(0,0,0,.5)">
  <div style="position:absolute;left:${W*.06}px;right:${W*.06}px;top:${D*.07}px;height:${D*.52}px;border-radius:14px;background:${keys};box-shadow:inset 0 0 0 6px #0d0e15"></div>
  <div style="position:absolute;left:${W*.31}px;right:${W*.31}px;top:${D*.68}px;height:${D*.25}px;border-radius:16px;background:linear-gradient(180deg,#CED2DF,#E3E5EC);box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)"></div></div>
 <div class="plane" style="left:${-LW/2}px;top:${-LH}px;width:${LW}px;height:${LH}px;transform-origin:50% 100%;transform:rotateX(${lid}deg);background:#05060B;border-radius:22px 22px 4px 4px;padding:14px;box-sizing:border-box;box-shadow:0 0 0 3px #B9BECE,0 0 90px 10px rgba(60,100,255,.45)"><div style="width:${sw}px;height:${sh}px;border-radius:8px;overflow:hidden;position:relative"><div style="transform:scale(${k});transform-origin:0 0;width:1440px;height:900px">${scr}</div></div><i style="position:absolute;left:50%;top:0;width:90px;height:18px;margin-left:-45px;background:#05060B;border-radius:0 0 10px 10px"></i></div>
 </div></div>`}
const phone3d=(scr,k,l,t,tf)=>`<div style="position:absolute;left:${l}px;top:${t}px;transform:${tf};transform-origin:0 0;z-index:3"><div style="position:relative;width:${393*k+30}px;height:${852*k+30}px;border-radius:64px;padding:15px;box-sizing:border-box;background:linear-gradient(145deg,#F4F5F9,#C9CDD9 50%,#8E94A8);box-shadow:0 60px 100px -20px rgba(0,0,40,.8),0 0 120px rgba(60,100,255,.35),inset 0 0 0 1.5px #fff"><div style="width:100%;height:100%;border-radius:50px;background:#02030A;padding:8px;box-sizing:border-box"><div style="width:100%;height:100%;border-radius:42px;overflow:hidden"><div style="transform:scale(${k});transform-origin:0 0;width:393px;height:852px">${scr}</div></div><i style="position:absolute;left:50%;top:24px;width:88px;height:24px;margin-left:-44px;border-radius:14px;background:#000"></i></div></div></div>`
const S=[]
// 1 overnight: laptop low angle (screens)
S.push(SC('s1',1000,arcs(800,720,2600)+laptop3d({scr:screenOvernight(),k:.9,W:1330,D:620,rx:-14,ry:-20,lid:10,cx:800,cy:560,sc:.66})))
// 2 footprint: laptop isometric
S.push(SC('s2',1100,laptop3d({scr:screenFootprint(),k:.86,W:1330,D:620,rx:-30,ry:-32,lid:10,cx:790,cy:600,sc:.64}),'background:linear-gradient(200deg,#0B3AD1 0%,#0A1E8C 40%,#020827 100%)'))
// 3 regime
S.push(SC('s3',700,arcs(800,470)+slab(regime(912),912,116,1.4,152,230,40,48)))
// 4 alerts
S.push(SC('s4',900,arcs(800,600)+slab(alertCard(),1182,376,1.17,60,200,34,48)))
// 5 panels
S.push(SC('s5',1000,arcs(800,640)+card(coinStats(),100,170,1.3)+card(trades(7,262),600,160,1.5)+card(watchlist(),1170,250,1.12)))
// 6 library
S.push(SC('s6',1000,arcs(800,680)+slab(libTable(),891,238,1.5,100,130,36,48)+card(equity(),350,660,1.0)))
// 7 mobile
S.push(SC('s7',1100,arcs(800,760)+phone3d(screenMobile(),.95,380,70,'perspective(2400px) rotateX(6deg) rotateY(-16deg) rotateZ(5deg)')+slab(promptCard(),393,138,1.5,880,420,24,36)))
// 8 settings
S.push(SC('s8',900,arcs(800,600)+slab(fpSettings(),640,401,1.25,240,190,34,48)))
// 9 design system
S.push(SC('s9',720,arcs(800,470)+slab(dsSeg(),592,48,1.4,240,130,34,40)+slab(dsToggles(),230,32,1.8,200,360,30,36)+slab(dsChips(),560,80,1.2,820,350,30,36)))
document.getElementById('root').innerHTML=S.join('')
</script>
