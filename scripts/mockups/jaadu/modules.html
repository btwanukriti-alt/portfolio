<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Geist;font-weight:300;src:url(node_modules/@fontsource/geist/files/geist-latin-300-normal.woff2)}
@font-face{font-family:Geist;font-weight:400;src:url(node_modules/@fontsource/geist/files/geist-latin-400-normal.woff2)}
@font-face{font-family:Geist;font-weight:500;src:url(node_modules/@fontsource/geist/files/geist-latin-500-normal.woff2)}
@font-face{font-family:Geist;font-weight:600;src:url(node_modules/@fontsource/geist/files/geist-latin-600-normal.woff2)}
@font-face{font-family:Geist;font-weight:700;src:url(node_modules/@fontsource/geist/files/geist-latin-700-normal.woff2)}
@font-face{font-family:'IBM Plex Mono';font-weight:400;src:url(node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2)}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url(node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2)}
body{margin:0;background:#fff}
.mod{position:relative;width:1600px;overflow:hidden;font-family:Geist,sans-serif;margin:0 0 60px;background:#00010F}
.orb{position:absolute;border-radius:50%;filter:blur(8px);pointer-events:none}

.plate{position:absolute;overflow:hidden;border-radius:56px;background:#040929;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.07),0 40px 80px -40px rgba(0,0,0,.9)}
.glow{display:none}
.plate.light{background:linear-gradient(180deg,#F1F2F6,#D6DAE5);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9),0 40px 80px -40px rgba(0,0,0,.9)}
.plate.glass{background:linear-gradient(135deg,#F4F6FF 0%,#D4DCFB 55%,#B9C6F7 100%);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9),0 40px 80px -40px rgba(0,0,0,.9)}
.plate.warm{background:linear-gradient(180deg,#ECE9E6,#CFCAC6);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.8),0 40px 80px -40px rgba(0,0,0,.9)}
.block{position:absolute;border-radius:56px;overflow:hidden;background:#0B1757;color:#F1F6FF;padding:60px 68px;box-sizing:border-box;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.09),0 40px 80px -40px rgba(0,0,0,.9)}
.block h3{font-weight:400;font-size:56px;margin:0;letter-spacing:-.02em;line-height:1.1;color:#F1F6FF;position:relative;z-index:2}
.block p{font-weight:400;font-size:24px;line-height:1.55;margin:22px 0 0;color:rgba(190,208,240,.78);max-width:580px;position:relative;z-index:2}
.cr{position:absolute;overflow:hidden;z-index:2;box-shadow:0 30px 50px -10px rgba(0,0,20,.7)}
.cr>div{transform-origin:0 0}
.lap{position:absolute}.lap .lid{position:relative;background:#04050B;padding:13px 13px 15px;border-radius:24px 24px 4px 4px;box-shadow:0 0 0 5px #F6F7FA,0 0 0 6px #C9CDD8,0 45px 70px -25px rgba(30,40,90,.55)}
.lap .lid:before{content:"";position:absolute;left:50%;top:0;width:96px;height:20px;margin-left:-48px;background:#04050B;border-radius:0 0 12px 12px;z-index:3}
.lap .lid:after{content:"";position:absolute;left:50%;top:6px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#14172a;z-index:4}
.lap .scr{position:relative;overflow:hidden;border-radius:8px;background:#00022b}.lap .scr>div{transform-origin:0 0}
.lap .base{position:absolute;height:22px;background:linear-gradient(180deg,#FFFFFF 0%,#EDEEF3 45%,#CDD0DB 100%);border-radius:0 0 28px 28px;box-shadow:0 34px 44px -14px rgba(30,40,90,.5),inset 0 1px 0 #fff}
.lap .base:before{content:"";position:absolute;left:50%;top:0;width:190px;height:8px;margin-left:-95px;border-radius:0 0 12px 12px;background:linear-gradient(180deg,#C2C6D2,#E4E6EE)}
.chip{position:absolute;z-index:4;display:flex;align-items:center;gap:12px;background:#F1F6FF;border-radius:999px;padding:13px 24px 13px 18px;font-weight:500;font-size:22px;color:#10153A;box-shadow:0 12px 28px -10px rgba(0,0,20,.7);white-space:nowrap}
.chip i{width:14px;height:14px;border-radius:50%;background:var(--c,#5985ff)}
.dl{z-index:4;position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
</style>
<script src="comp.js"></script>
<div id="root"></div>
<script>
const cr=(html,w,h,k,l,t,r=10,extra='')=>`<div class="cr" style="left:${l}px;top:${t}px;width:${w*k}px;height:${h*k}px;border-radius:${r*k}px;${extra}"><div style="transform:scale(${k});width:${w}px;height:${h}px">${html}</div></div>`
const lap=(scr,k,l,t,w=1440,h=900)=>`<div class="lap" style="left:${l}px;top:${t}px"><div class="lid"><div class="scr" style="width:${w*k}px;height:${h*k}px"><div style="transform:scale(${k});width:${w}px;height:${h}px">${scr}</div></div></div><div class="base" style="left:-30px;right:-30px;bottom:-22px"></div></div>`
const plate=(l,t,w,h,inner,cls='')=>{const a=(l*7+t*3)%5;const gx=[.1,.55,.3,.7,.4][a]*(w-300),gy=[.3,.0,.5,.2,.6][a]*(h-200);return `<div class="plate ${cls}" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px"><div class="glow" style="left:${gx}px;top:${gy}px"></div>${inner}</div>`}
const block=(l,t,w,h,a,b)=>`<div class="block" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px"><h3>${a}</h3><p>${b}</p></div>`
const call=(w,h,x1,y1,x2,y2,c,txt,cx,cy)=>`<svg class="dl" width="${w}" height="${h}"><path d="M${x1} ${y1} L${x2} ${y2}" fill="none" stroke="#7F93C4" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/><circle cx="${x1}" cy="${y1}" r="9" fill="${c}" stroke="#fff" stroke-width="3"/></svg><div class="chip" style="--c:${c};left:${cx}px;top:${cy}px"><i></i>${txt}</div>`
let MI=0;const ORB=[['#00E5FF',.9],['#5985FF',.95],['#7B5CFF',.8],['#45FFB5',.55]]
const mod=(id,h,inner)=>{const r=(n)=>{MI++;return ((Math.sin(MI*12.9898+n*78.233)*43758.5453)%1+1)%1};let o='';for(let i=0;i<4;i++){const c=ORB[(MI+i)%4],d=300+r(i)*260;o+=`<div class="orb" style="left:${r(1+i)*1500-d/2}px;top:${r(5+i)*(h-100)-d/3}px;width:${d}px;height:${d}px;background:radial-gradient(circle at 35% 30%,${c[0]},rgba(0,0,0,0) 72%);opacity:${c[1]}"></div>`}return `<div class="mod" id="${id}" style="height:${h}px">${inner}</div>`}
const N='box-shadow:none;overflow:visible';const tilt=(inner,tf,l,t)=>`<div style="position:absolute;left:${l}px;top:${t}px;transform:${tf};transform-origin:0 0;transform-style:preserve-3d">${inner}</div>`
const tablet=(scr,k,w=1440,h=900)=>`<div style="position:relative;width:${w*k+56}px;height:${h*k+56}px;box-sizing:border-box;padding:28px;border-radius:46px;background:#06070C;box-shadow:0 0 0 3px #C9CDD9,0 0 0 5px #8E94A8,40px 60px 80px -10px rgba(40,60,160,.55),70px 110px 140px -30px rgba(20,30,100,.5)"><div style="width:${w*k}px;height:${h*k}px;border-radius:18px;overflow:hidden;background:#00022b"><div style="transform:scale(${k});transform-origin:0 0;width:${w}px;height:${h}px">${scr}</div></div><i style="position:absolute;right:9px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:#14172a"></i></div>`
const M=[]
// 1 spread: overnight (standout)
M.push(mod('m-overnight',1000,
 plate(40,40,740,920,tilt(lap(screenOvernight(),.95,0,0),'perspective(2200px) rotateX(8deg) rotateY(20deg) rotateZ(-3deg)',80,150),'glass')+
 plate(820,40,740,560,cr(campaign(),893,259,1.2,72,150))+
 block(820,620,740,340,'Set it up. Wake to a shortlist','Pick coins and a timeframe. Jaadu runs three falsification stages overnight and keeps what survives.')))
// 2 spotlight: footprint chart on a tilted tablet (real Figma chart frame 1058:32183 inside the terminal screen)
M.push(mod('m-footprint',1080,plate(40,40,1520,1000,
 tilt(tablet(screenFootprint(),.86),'perspective(2400px) rotateX(14deg) rotateY(-24deg) rotateZ(-6deg)',210,150),'glass')))
// 3 bento: market panels
M.push(mod('m-panels',1000,
 plate(40,40,1520,300,cr(regime(912),912,116,1.45,99,66,16))+
 plate(40,360,520,600,cr(coinStats(),350,331,1.3,35,80,24))+
 plate(580,360,540,600,cr(trades(8,300),360,300,1.35,26,110,24))+
 plate(1140,360,420,600,cr(watchlist(),360,160,1.1,12,210,24))))
// 4 spread mirrored: settings + laptop footprint
M.push(mod('m-settings',1000,
 plate(40,40,740,560,cr(fpSettings(),640,401,1.2,56,70,24))+
 block(40,620,740,340,'One chart, your way','Four display modes and a volume profile, set in one panel. Each candle splits into price cells.')+
 plate(820,40,740,920,tilt(lap(screenFootprint(),.95,0,0),'perspective(2200px) rotateX(8deg) rotateY(-20deg) rotateZ(3deg)',-120,150),'glass')))
// 5 spotlight regime
M.push(mod('m-regime',560,plate(40,40,1520,480,
 cr(regime(912),912,116,1.55,50,100,16)+
 call(1520,480,859,205,800,380,'#ff5971','Breakout is 35% of this window',560,370))))
// 6 spotlight alerts
M.push(mod('m-alerts',900,plate(40,40,1520,820,
 cr(alertCard(),1182,376,1.26,50,150,8)+
 call(1520,820,645,232,420,90,'#5985ff','2 of 3 conditions met',200,40)+
 call(1520,820,1066,572,1040,690,'#45ffb5','Footprint condition still active',760,690))))
// 7 bento library
M.push(mod('m-library',1000,
 plate(40,40,1520,470,cr(libTable(),891,238,1.5,92,60,12))+
 plate(40,530,940,430,cr(equity(),891,280,1.2,40,60,12))+
 plate(1000,530,560,430,cr(paramDiff(),891,217,1.0,40,100,12))))
// 8 spread: mobile chart prompt (real mobile frame 3644:206616)
const phone=(scr,k,l,t)=>`<div style="position:relative;width:${393*k+34}px;height:${852*k+34}px;border-radius:${68}px;padding:17px;box-sizing:border-box;background:linear-gradient(145deg,#FFFFFF 0%,#E6E8EF 45%,#BFC4D2 100%);box-shadow:0 50px 80px -30px rgba(30,40,90,.55),inset 0 0 0 1.5px #fff"><div style="position:relative;width:100%;height:100%;border-radius:52px;background:#02030A;padding:8px;box-sizing:border-box;box-shadow:inset 0 0 0 1px #000"><div style="position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden"><div style="transform:scale(${k});transform-origin:0 0;width:393px;height:852px">${scr}</div></div><i style="position:absolute;left:50%;top:18px;width:92px;height:26px;margin-left:-46px;border-radius:14px;background:#000;z-index:5"></i></div><i style="position:absolute;right:-4px;top:210px;width:4px;height:90px;border-radius:0 3px 3px 0;background:#C3C8D6"></i><i style="position:absolute;left:-4px;top:170px;width:4px;height:50px;border-radius:3px 0 0 3px;background:#C3C8D6"></i></div>`
M.push(mod('m-mobile',1000,
 plate(40,40,740,920,tilt(phone(screenMobile(),.82,0,0),'perspective(2200px) rotateX(8deg) rotateY(-20deg) rotateZ(5deg)',210,70),'warm')+
 plate(820,40,740,560,cr(promptCard(),393,138,1.6,55,160,16))+
 block(820,620,740,340,'Ask about one point','Tap the chart, then ask. On mobile the prompt docks to the bottom of the screen.')))
// 9 bento design system
M.push(mod('m-system',820,
 plate(40,40,960,240,cr(dsSeg(),592,48,1.4,65,86,14,N))+
 plate(1020,40,540,240,cr(dsToggles(),230,32,1.8,60,90,4,N))+
 plate(40,300,760,480,cr(dsButtons(),600,40,1.1,40,100,8,N)+cr(dsTabs(),300,32,1.6,40,220,8,N)+cr(dsInputs(),420,64,1.2,40,330,8,N))+
 plate(820,300,740,480,cr(dsChips(),560,80,1.3,6,190,16,N))))
// 10 palette
const sw=[['#00022B','Background'],['#5985FF','Primary 500'],['#2653CF','Primary 400'],['#5CB5FF','Primary 700'],['#45FFB5','Green'],['#FF5971','Red'],['#FFBD67','Yellow'],['#00FFFF','Cyan'],['#F1F6FF','Text primary']]
M.push(mod('m-palette',1020,plate(40,40,1520,940,`<div style="position:absolute;left:70px;top:60px;right:70px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px">${sw.map(s=>`<div style="border-radius:32px;overflow:hidden;background:#0B1238;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)"><div style="height:110px;background:${s[0]}"></div><div style="padding:16px 26px;font:500 26px Geist;color:#ECEDF4">${s[1]}<div style="font:400 22px 'IBM Plex Mono';color:#A7BCE4;margin-top:4px">${s[0]}</div></div></div>`).join('')}</div>
 <div style="position:absolute;left:70px;right:70px;bottom:56px;display:flex;justify-content:space-between;align-items:baseline;color:#F1F6FF"><span style="font:700 76px Geist">Geist</span><span style="font:400 64px 'IBM Plex Mono';color:#A7BCE4">IBM Plex Mono</span></div>`)))
document.getElementById('root').innerHTML=M.join('')
</script>
