<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Geist;font-weight:400;src:url(node_modules/@fontsource/geist/files/geist-latin-400-normal.woff2)}
@font-face{font-family:Geist;font-weight:500;src:url(node_modules/@fontsource/geist/files/geist-latin-500-normal.woff2)}
@font-face{font-family:Geist;font-weight:600;src:url(node_modules/@fontsource/geist/files/geist-latin-600-normal.woff2)}
body{margin:0;background:#fff}
.bd{position:relative;width:1600px;overflow:hidden;margin:0 0 60px;font-family:Geist,sans-serif;background:radial-gradient(1100px 760px at 15% 0%,rgba(30,90,255,.16),rgba(30,90,255,0) 70%),radial-gradient(1000px 700px at 95% 100%,rgba(0,140,255,.10),rgba(0,140,255,0) 70%),linear-gradient(160deg,#01072A 0%,#01041A 55%,#000210 100%)}
.rim::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:2px;pointer-events:none;z-index:5;background:linear-gradient(135deg,#ffffff 0%,#8fd3ff 12%,rgba(90,140,255,.35) 35%,rgba(90,140,255,.08) 55%,rgba(90,140,255,.35) 78%,#6fb8ff 92%,#e6f4ff 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.tl{position:absolute;overflow:hidden;border-radius:36px;background:linear-gradient(180deg,rgba(90,140,255,.10),rgba(90,140,255,.03));box-shadow:0 0 40px -10px rgba(80,150,255,.45)}
.tl img{position:absolute;display:block;border-radius:18px;box-shadow:0 30px 60px -20px rgba(0,0,0,.8)}
.ex{position:absolute;border-radius:36px;padding:56px 52px;box-sizing:border-box;background:linear-gradient(160deg,rgba(90,140,255,.16),rgba(90,140,255,.05));box-shadow:0 0 40px -10px rgba(80,150,255,.45);color:#F1F6FF}
.ex .lb{font:600 18px Geist;letter-spacing:.14em;color:#5CB5FF;text-transform:uppercase}
.ex h3{font:500 46px/1.1 Geist;margin:18px 0 0;letter-spacing:-.02em}
.ex p{font:400 22px/1.55 Geist;color:#A7BCE4;margin:22px 0 0}
.ex ul{margin:26px 0 0;padding:0;list-style:none}
.ex li{font:400 20px/1.45 Geist;color:#D6E2FA;padding:12px 0 12px 30px;position:relative;border-top:1px solid rgba(150,190,255,.14)}
.ex li:before{content:'';position:absolute;left:4px;top:22px;width:10px;height:10px;border-radius:50%;background:#5985FF;box-shadow:0 0 10px #5985FF}
.chip{position:absolute;z-index:6;display:flex;align-items:center;gap:12px;background:#F1F6FF;border-radius:999px;padding:12px 22px 12px 16px;font:500 21px Geist;color:#0A1240;box-shadow:0 14px 30px -10px rgba(0,0,0,.7);white-space:nowrap}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--c,#5985ff)}
.dl{position:absolute;left:0;top:0;z-index:6;overflow:visible;pointer-events:none}
</style>
<div id="root"></div>
<script>
const F='feat/'
const M=(id,h,inner)=>`<div class="bd" id="${id}" style="height:${h}px">${inner}</div>`
const tile=(l,t,w,h,inner)=>`<div class="tl rim" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px">${inner}</div>`
const img=(n,w,l,t,r=18)=>`<img src="${F}${n}.png" style="left:${l}px;top:${t}px;width:${w}px;border-radius:${r}px">`
const ex=(l,t,w,h,lb,title,body,items=[])=>`<div class="ex rim" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px"><div class="lb">${lb}</div><h3>${title}</h3><p>${body}</p>${items.length?`<ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}</div>`
const call=(x1,y1,x2,y2,c,txt,cx,cy)=>`<svg class="dl" width="1600" height="1200"><path d="M${x1} ${y1} L${x2} ${y2}" fill="none" stroke="#9FB4E8" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/><circle cx="${x1}" cy="${y1}" r="9" fill="${c}" stroke="#fff" stroke-width="3"/></svg><div class="chip" style="--c:${c};left:${cx}px;top:${cy}px"><i></i>${txt}</div>`
const S=[]
// 1 Footprint, zoomed
S.push(M('f1',760,tile(40,40,1100,680,img('fp-zoom',1060,20,60,14))+
 call(1031,434,900,640,'#45FFB5','One candle, split into price bins',680,640)+
 call(457,179,330,640,'#5CB5FF','Buys, sells and delta for a bin',90,640)+
 ex(1160,40,400,680,'Footprint chart','See inside every candle','A normal candle shows four prices. The footprint splits it into small price bins and shows the volume traded in each one.',['Each cell is one price bin with its volume','Hover a bin for buys, sells and delta','Switch OHLC and Footprint from the toolbar'])))
// 2 Regime
S.push(M('f2',760,ex(40,40,560,680,'Regime','Read the market’s mood','Jaadu labels the market as sideways, breakout, volatile or reversal, with a share for each. Strategies and alerts use the same reading.',['Updates live beside the chart','Strategies are matched to the current regime'])+tile(620,40,940,680,img('c-regime',820,60,150,36))))
// 3 Alerts
S.push(M('f3',1060,tile(40,40,1520,440,img('c-alert',1480,20,30,14))+tile(40,500,520,520,img('c-create-alert',440,40,40,18))+
 ex(580,500,980,520,'Alerts','Alerts on more than price','Combine conditions across price, POC, footprint, volume and regime. An alert fires only when all of them hold together, and shows how many are met so far.',['“2 of 3 met” progress on every alert','Notify in app or by email, once or recurring'])))
// 4 Quant Lab: overnight
S.push(M('f4',1310,ex(40,40,1520,300,'Quant Lab · Overnight Discoveries','Set it up. Wake up to a shortlist.','Pick at least five coins and a timeframe. Overnight, Jaadu generates hundreds of candidate strategies and runs each through three falsification tests. Only the survivors reach your morning shortlist.')+
 tile(40,360,1520,470,img('funnel',1440,40,30))+tile(40,850,1520,420,img('cards',1440,40,40))))
// 5 Library
S.push(M('f5',1000,tile(40,40,1040,920,img('library',1000,20,20))+
 ex(1100,40,460,920,'Quant Lab · Library','Every strategy, one card','Saved strategies sit in a library, filtered by regime, type and health. Each card shows its regime, direction, win rate and backtest.',['Run a backtest from the card','Send it to paper trading or fork it','Select several and press Compare'])))
// 6 Strategy comparison
S.push(M('f6',1320,ex(40,40,1520,250,'Quant Lab · Strategy comparison','Compare strategies side by side','Sharpe, return, drawdown, win rate and profit factor in one table, the best value in each column highlighted, and every equity curve on one chart.')+
 tile(40,310,1520,450,img('cmp',1440,40,32))+tile(40,780,1520,500,img('equity',1440,40,24))))
// 7 Deja Vu
S.push(M('f7',760,ex(40,40,400,680,'Quant Lab · Déjà Vu','Has this happened before?','Describe today’s setup by regime, structure and flow. Déjà Vu finds similar moments in market history and shows what happened next.',['Matches ranked by similarity','What happened next, in one chart'])+
 tile(460,40,1100,680,img('deja',1060,20,60))))
// 8 Chart prompt
S.push(M('f8',760,tile(40,40,960,680,img('c-prompt-suggested',800,80,90,26)+img('c-prompt-typing',800,80,420,26))+
 ex(1020,40,540,680,'AI chart prompt','Ask about any point','Tap a point on the chart and ask about it. Quick prompts explain a move, the volume at a level, or draw support.',['Floats on desktop, docks on mobile'])))
document.getElementById('root').innerHTML=S.join('')
</script>
