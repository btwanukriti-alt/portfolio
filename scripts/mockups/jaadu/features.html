<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Geist;font-weight:400;src:url(node_modules/@fontsource/geist/files/geist-latin-400-normal.woff2)}
@font-face{font-family:Geist;font-weight:500;src:url(node_modules/@fontsource/geist/files/geist-latin-500-normal.woff2)}
@font-face{font-family:Geist;font-weight:600;src:url(node_modules/@fontsource/geist/files/geist-latin-600-normal.woff2)}
body{margin:0;background:#fff}
.bd{position:relative;width:1600px;overflow:hidden;margin:0 0 60px;font-family:Geist,sans-serif;background:radial-gradient(1100px 760px at 15% 0%,rgba(30,90,255,.16),rgba(30,90,255,0) 70%),radial-gradient(1000px 700px at 95% 100%,rgba(0,140,255,.10),rgba(0,140,255,0) 70%),linear-gradient(160deg,#01072A 0%,#01041A 55%,#000210 100%)}
.rim::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:2px;pointer-events:none;z-index:5;background:linear-gradient(135deg,#ffffff 0%,#8fd3ff 12%,rgba(90,140,255,.35) 35%,rgba(90,140,255,.08) 55%,rgba(90,140,255,.35) 78%,#6fb8ff 92%,#e6f4ff 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.tl{position:absolute;overflow:hidden;border-radius:14px;background:linear-gradient(180deg,rgba(90,140,255,.10),rgba(90,140,255,.03));box-shadow:0 0 40px -10px rgba(80,150,255,.45)}
.tl img{position:absolute;display:block;border-radius:18px;box-shadow:0 30px 60px -20px rgba(0,0,0,.8)}
.ex{position:absolute;padding:56px 8px;box-sizing:border-box;color:#F1F6FF;display:flex;flex-direction:column;justify-content:flex-start}
.ex .lb{font:500 19px Geist;color:#6F86B8}
.ex h3{font:500 44px/1.12 Geist;margin:14px 0 0;letter-spacing:-.025em}
.ex p{font:400 21px/1.55 Geist;color:#8FA3CC;margin:18px 0 0;max-width:640px}
.ex ul{margin:26px 0 0;padding:0;list-style:none}
.ex li{font:400 20px/1.45 Geist;color:#D6E2FA;padding:12px 0 12px 30px;position:relative;border-top:1px solid rgba(150,190,255,.14)}
.ex li:before{content:'';position:absolute;left:4px;top:22px;width:10px;height:10px;border-radius:50%;background:#5985FF;box-shadow:0 0 10px #5985FF}
.chip{position:absolute;z-index:6;display:flex;align-items:center;gap:12px;background:#F1F6FF;border-radius:999px;padding:12px 22px 12px 16px;font:500 21px Geist;color:#0A1240;box-shadow:0 14px 30px -10px rgba(0,0,0,.7);white-space:nowrap}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--c,#5985ff)}
.dl{position:absolute;left:0;top:0;z-index:6;overflow:visible;pointer-events:none}
.bd.cv{background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='none' stroke='%23fff' stroke-opacity='.85' stroke-width='12'/%3E%3C/svg%3E") left -70px top -70px/250px 250px no-repeat,url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 100'%3E%3Crect x='0' y='4' width='300' height='92' rx='46' fill='%23FFE07A' transform='rotate(4 150 50)'/%3E%3C/svg%3E") right -70px top 30px/320px 106px no-repeat,url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23B6EBD2'/%3E%3C/svg%3E") left -110px bottom -150px/380px 380px no-repeat,url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 4l13.6 30.4 33.1 3.4-24.8 22.2 7.1 32.6L50 75.8 21 92.6l7.1-32.6L3.3 37.8l33.1-3.4z' fill='%235C8BFF'/%3E%3C/svg%3E") right 40px bottom 36px/110px 110px no-repeat,radial-gradient(120% 90% at 50% 40%,rgba(255,255,255,.55),rgba(255,255,255,0) 70%),#CFDDFF}
.bd.cv .ex h3{color:#0E1452}.bd.cv .ex p{color:#3D4A7A}
.tl.cvt{background:rgba(255,255,255,.28);box-shadow:none}.tl.cvt::after{display:none}
</style>
<div id="root"></div>
<script>
const F='feat/'
const M=(id,h,inner)=>`<div class="bd" id="${id}" style="height:${h}px">${inner}</div>`
const tile=(l,t,w,h,inner)=>`<div class="tl rim" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px">${inner}</div>`
const img=(n,w,l,t,r=10)=>`<img src="${F}${n}.png" style="left:${l}px;top:${t}px;width:${w}px;border-radius:${r}px">`
const ex=(l,t,w,h,lb,title,body,items=[])=>`<div class="ex" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px"><h3>${title}</h3><p>${body}</p></div>`
const call=(x1,y1,x2,y2,c,txt,cx,cy)=>`<svg class="dl" width="1600" height="1200"><path d="M${x1} ${y1} L${x2} ${y2}" fill="none" stroke="#9FB4E8" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/><circle cx="${x1}" cy="${y1}" r="9" fill="${c}" stroke="#fff" stroke-width="3"/></svg><div class="chip" style="--c:${c};left:${cx}px;top:${cy}px"><i></i>${txt}</div>`
const S=[]
const T=(l,t,w,lb,title,body)=>ex(l,t,w,230,lb,title,body)
S.push(M('f1',760,tile(40,40,1100,680,img('fp-zoom',1060,20,60,14))+
 call(1031,434,900,640,'#45FFB5','One candle, split into price bins',680,640)+
 call(457,179,330,640,'#5CB5FF','Buys, sells and delta for a bin',90,640)+
 T(1160,20,400,'Footprint chart','See inside every candle','Each candle splits into price bins, with the volume traded in each.')+
 tile(1160,340,400,380,img('c-trades',360,20,96,18))))
S.push(M('f2',760,T(40,20,560,'Regime','Read the market’s mood','Sideways, breakout, volatile or reversal, with a share for each.')+
 tile(40,280,560,440,img('c-crypto',500,30,70,22))+tile(620,40,940,680,img('c-regime',820,60,150,36))))
S.push(M('f3',780,tile(40,40,520,700,img('c-create-alert',440,40,30,18))+
 T(580,20,980,'Alerts','Alerts on more than price','Price, POC, footprint and regime conditions, firing only when all of them hold.')+
 tile(580,270,980,470,img('c-alert',1500,20,30,14))))
S.push(M('f4',1240,T(40,10,1520,'Quant Lab · Overnight Discoveries','Set it up. Wake up to a shortlist.','Hundreds of strategies tested overnight. Only the survivors reach your morning shortlist.')+
 tile(40,290,1520,470,img('funnel',1440,40,30))+tile(40,780,1520,420,img('cards',1440,40,40))))
S.push(M('f5',1000,tile(40,40,1040,920,img('library',1000,20,20))+
 T(1100,20,460,'Quant Lab · Library','Every strategy, one card','Regime, direction, win rate and backtest, with paper trade and fork on the card.')+
 tile(1100,340,460,620,img('card1',420,20,100,22))))
S.push(M('f6',1250,T(40,10,1520,'Quant Lab · Comparison','Compare strategies side by side','Five metrics in one table, and every equity curve on one chart.')+
 tile(40,240,1520,450,img('cmp',1440,40,32))+tile(40,710,1520,500,img('equity',1440,40,24))))
S.push(M('f7',760,T(40,20,400,'Quant Lab · Déjà Vu','Has this happened before?','Finds similar moments in market history and shows what happened next.')+
 tile(40,320,400,400,img('deja-outcome',360,20,70,18))+tile(460,40,1100,680,img('deja',1060,20,60))))
S.push(M('f8',760,tile(40,40,960,680,img('c-prompt-suggested',800,80,90,26)+img('c-prompt-typing',800,80,420,26))+
 T(1020,20,540,'AI chart prompt','Ask about any point','Tap the chart and ask. On mobile it docks to the bottom.')+
 tile(1020,300,540,420,img('c-prompt-generating',500,20,130,24))))
document.getElementById('root').innerHTML=S.join('')
// Every other module sits on the home page's playful canvas (the Jaadu card colour).
for(const id of ['f2','f5','f8']){const m=document.getElementById(id);m.classList.add('cv');m.querySelectorAll('.tl').forEach(t=>t.classList.add('cvt'))}
</script>
