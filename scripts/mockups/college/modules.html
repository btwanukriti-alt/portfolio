<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=Poppins:wght@300;400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
:root{--display:'Bricolage Grotesque','Figtree',sans-serif;--ui:'Figtree',sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#fff;font-family:var(--ui)}
#lib{position:absolute;left:-9999px;top:0;width:1200px}
.mod{position:relative;width:1600px;overflow:hidden;margin:0 0 60px;background:#EEF0F5;font-family:Poppins,sans-serif}
.abs{position:absolute}
.plate{position:absolute;overflow:hidden;border-radius:56px;background:linear-gradient(180deg,#F8F9FC,#E7E9F0);box-shadow:inset 0 0 0 2px rgba(255,255,255,.95),inset 0 -26px 50px -28px rgba(30,30,70,.07)}
.block{position:absolute;border-radius:56px;background:#12326E;color:#fff;padding:60px 68px}
.block h3{text-wrap:balance;font-weight:300;font-size:58px;margin:0;letter-spacing:-.02em;line-height:1.08}
.block p{font-weight:300;font-size:25px;line-height:1.5;margin:22px 0 0;opacity:.9;max-width:600px}
.mon{position:absolute;padding:12px;background:#0A0A0D;border-radius:34px;box-shadow:inset 0 0 0 3px #3b3b42,0 40px 70px -34px rgba(10,10,40,.55)}
.mon .scr{overflow:hidden;border-radius:24px;background:#fff}
.card-c{position:absolute;overflow:hidden;background:#fff;border-radius:36px;box-shadow:0 18px 40px -22px rgba(30,30,80,.28)}
.z{position:absolute;transform-origin:0 0}
.drop{filter:drop-shadow(0 14px 26px rgba(20,30,80,.16))}
.pillc{position:absolute;background:#fff;color:#12326E;font:600 26px Figtree,sans-serif;padding:14px 26px;border-radius:99px;box-shadow:0 14px 30px -12px rgba(20,30,80,.35);white-space:nowrap}
.dot{position:absolute;width:20px;height:20px;border-radius:50%;background:#12326E;box-shadow:0 0 0 5px #fff;transform:translate(-50%,-50%)}
svg.ln{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.lbl2{position:absolute;font:500 26px Figtree,sans-serif;color:#8C8FA0}

.block.sm{padding:44px 52px}.block.sm h3{font-size:46px}.block.sm p{font-size:22px;margin-top:16px}
.dark{position:absolute;overflow:hidden;border-radius:56px;background:radial-gradient(120% 140% at 85% 0%,#1B3F86 0%,#0F2352 45%,#08153A 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.dtxt{position:absolute;color:#fff;max-width:560px}.dtxt h3{font-weight:300;font-size:52px;margin:0;letter-spacing:-.02em;line-height:1.08;text-wrap:balance}.dtxt p{font-weight:300;font-size:25px;line-height:1.5;margin:20px 0 0;opacity:.78;max-width:520px}
.lap{position:absolute}.lap .bz{background:#0A0A0D;padding:14px 14px 16px;border-radius:26px 26px 8px 8px;box-shadow:inset 0 0 0 3px #3b3b42}
.lap .scr{overflow:hidden;border-radius:12px;background:#fff;position:relative}
.lap .base{height:22px;margin:0 -34px;border-radius:0 0 28px 28px;background:linear-gradient(180deg,#EDEBE7,#CFCCC6);box-shadow:0 30px 40px -24px rgba(10,10,40,.55);position:relative}
.lap .base:after{content:"";position:absolute;left:50%;top:0;width:150px;height:8px;margin-left:-75px;border-radius:0 0 10px 10px;background:#B9B6AF}
.swp{position:absolute;border-radius:56px;overflow:hidden}
</style>
<div id="lib"></div>
<div id="out"></div>
<script src="screens.js"></script>
<script>
// Render the app screens once into a hidden library; modules clone pieces of them.
const lib=document.getElementById('lib');
const mount=(id,html)=>{const d=document.createElement('div');d.id=id;d.innerHTML=html;lib.appendChild(d);return d};
mount('s-fin',finance());mount('s-staff',staff());mount('s-d3',stackDrawer('programme'));mount('s-d2',stackDrawer('college'));
const q=(sel,i=0)=>lib.querySelectorAll(sel)[i];
// z(): clone a library element, scaled by k, absolutely placed.
function z(sel,k,l,t,{i=0,drop=false,w=null}={}){const el=q(sel,i);const c=el.cloneNode(true);
  const h=document.createElement('div');h.className='z cmp'+(drop?' drop':'');h.style.cssText=`left:${l}px;top:${t}px;transform:scale(${k});width:${w||el.getBoundingClientRect().width}px`;
  c.style.margin='0';h.appendChild(c);return h}
// mon(): a desktop screen in a bezel, cropped by its plate.
function mon(sel,k,l,t,sx,sy,w,h){const m=document.createElement('div');m.className='mon';m.style.cssText=`left:${l}px;top:${t}px`;
  const s=document.createElement('div');s.className='scr';s.style.cssText=`width:${w}px;height:${h}px;position:relative`;
  const c=q(sel+' .app').cloneNode(true);c.dataset.h=q(sel+' .app').getBoundingClientRect().height;c.style.cssText=`position:absolute;left:${-sx*k}px;top:${-sy*k}px;transform:scale(${k});transform-origin:0 0;width:1200px;height:${c.dataset.h||800}px;margin:0`;
  s.appendChild(c);m.appendChild(s);return m}
function lap(sel,k,l,t,h,sx=0,sy=0){const m=document.createElement('div');m.className='lap';m.style.cssText=`left:${l}px;top:${t}px`;
  const bz=document.createElement('div');bz.className='bz';const sc=document.createElement('div');sc.className='scr';sc.style.cssText=`width:${1200*k}px;height:${h}px`;
  const src=q(sel+' .app');const c=src.cloneNode(true);const hh=src.getBoundingClientRect().height;
  c.style.cssText=`position:absolute;left:${-sx*k}px;top:${-sy*k}px;transform:scale(${k});transform-origin:0 0;width:1200px;height:${hh}px;margin:0`;
  sc.appendChild(c);bz.appendChild(sc);m.appendChild(bz);const b=document.createElement('div');b.className='base';m.appendChild(b);return m}
function dark(parent,l,t,w,h){const p=document.createElement('div');p.className='dark';p.style.cssText=`left:${l}px;top:${t}px;width:${w}px;height:${h}px`;parent.appendChild(p);return p}
function dtxt(parent,l,t,title,text){const d=document.createElement('div');d.className='dtxt';d.style.cssText=`left:${l}px;top:${t}px`;d.innerHTML=`<h3>${title}</h3><p>${text}</p>`;parent.appendChild(d)}
function plate(parent,l,t,w,h){const p=document.createElement('div');p.className='plate';p.style.cssText=`left:${l}px;top:${t}px;width:${w}px;height:${h}px`;parent.appendChild(p);return p}
function block(parent,l,t,w,h,title,text){const b=document.createElement('div');b.className='block';b.style.cssText=`left:${l}px;top:${t}px;width:${w}px;height:${h}px`;b.innerHTML=`<h3>${title}</h3><p>${text}</p>`;parent.appendChild(b)}
function cardc(parent,l,t,w,h){const c=document.createElement('div');c.className='card-c';c.style.cssText=`left:${l}px;top:${t}px;width:${w}px;height:${h}px`;parent.appendChild(c);return c}
function mod(id,h){const m=document.createElement('div');m.className='mod';m.id=id;m.style.height=h+'px';document.getElementById('out').appendChild(m);return m}
// dashed callout line from (x1,y1) to a dot at (x2,y2)
function callout(parent,pts,text,px,py){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','ln');s.setAttribute('width',1);s.setAttribute('height',1);
  s.innerHTML=`<path d="${pts}" fill="none" stroke="#8C8FA0" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/>`;parent.appendChild(s);
  if(text){const p=document.createElement('div');p.className='pillc';p.style.cssText=`left:${px}px;top:${py}px`;p.textContent=text;parent.appendChild(p)}}
function dot(parent,x,y){const d=document.createElement('div');d.className='dot';d.style.cssText=`left:${x}px;top:${y}px`;parent.appendChild(d)}
function cmp(html,k,l,t,{drop=true}={}){const h=document.createElement('div');h.className='z cmp'+(drop?' drop':'');h.style.cssText=`left:${l}px;top:${t}px;transform:scale(${k})`;h.innerHTML=html;return h}

window.build=()=>{
// 1 HERO: laptop with the full drawer screen, enlarged header crop, title block
{const m=mod('m-spines',820);
 const A=plate(m,40,40,1040,740);A.appendChild(lap('#s-d3',0.8,26,70,600));
 const B=plate(m,1100,40,460,440);const c=cardc(B,24,24,412,392);
 const e=q('#s-d3 .app').cloneNode(true);e.style.cssText='position:absolute;left:-125px;top:-24px;transform:scale(1.3);transform-origin:0 0;width:1200px;height:800px;margin:0';c.appendChild(e);
 const bk=document.createElement('div');bk.className='block sm';bk.style.cssText='left:1100px;top:500px;width:460px;height:280px;padding:40px 44px';bk.innerHTML='<h3 style="font-size:40px">Every level stays in view</h3><p style="font-size:20px">Group, college and programme stay on screen as spines while the next drawer opens.</p>';m.appendChild(bk);}
// 2 DARK: target at a glance
{const m=mod('m-target',860);const p=dark(m,40,40,1520,780);
 dtxt(p,80,90,'Collected against target, at a glance','One bar and one marker show how far the group is from 80%.');
 const hero=z('#s-fin .hero',0.55,70,470,{drop:true});p.appendChild(hero);
 p.appendChild(lap('#s-fin',0.74,620,64,610));
 const u=lib.querySelector('#s-fin .hero .track u').getBoundingClientRect();const hb=lib.querySelector('#s-fin .hero').getBoundingClientRect();
 const mx=70+(u.left-hb.left)*0.55+1,my=470+(u.top-hb.top)*0.55;
 callout(p,`M${mx} ${my} V${my-34}`,null);dot(p,mx,my+2);}
// 3 BENTO finance: dense plates
{const m=mod('m-ranked',1000);
 const A=plate(m,40,40,880,600);A.appendChild(z('#s-fin .main > .card:last-child',1.12,24,36,{drop:true}));
 const B=plate(m,940,40,620,600);
 B.appendChild(z('#s-fin .callout',1.0,22,34,{drop:true,w:1000}));
 B.appendChild(z('#s-fin .hero',0.82,22,150,{drop:true}));
 B.appendChild(cmp(`<div class="card" style="width:880px;display:flex;flex-direction:column;gap:18px"><div class="cell2"><div class="mini"><b style="width:55.9%;background:#d92d20"></b><u style="left:80%"></u></div><small class="num">Science · ₹9.50 Cr of ₹17.00 Cr</small></div><div class="cell2"><div class="mini"><b style="width:83.8%;background:#12805c"></b><u style="left:80%"></u></div><small class="num">Engineering · ₹28.50 Cr of ₹34.00 Cr</small></div></div>`,0.9,22,372));
 const C=plate(m,40,660,500,300);
 C.appendChild(cmp(`<div style="display:flex;gap:16px"><span class="chip ok">83.8%</span><span class="chip warn">72.7%</span><span class="chip bad">55.9%</span></div>`,1.7,34,40));
 C.appendChild(cmp(`<div style="display:flex;gap:16px"><span class="chip bad">69.7%</span><span class="chip bad">66.7%</span></div>`,1.7,34,130));
 C.appendChild(cmp(`<div style="display:flex;gap:16px"><span class="chip warn">72.7%</span></div>`,1.7,34,220));
 const D=plate(m,560,660,500,300);
 D.appendChild(cmp(`<div class="card" style="width:260px;text-align:right"><div class="cap">Gap to 80% target</div><div style="font:700 28px var(--display);color:var(--bad);margin-top:6px" class="num">−24.1 pts</div></div>`,1.45,40,30));
 D.appendChild(cmp(`<div class="card" style="width:260px;text-align:right"><div class="cap">Gap to 80% target</div><div style="font:700 28px var(--display);color:var(--ok);margin-top:6px" class="num">+3.8 pts</div></div>`,1.45,40,170));
 const E=plate(m,1080,660,480,300);E.appendChild(z('#s-fin .main > .row:nth-of-type(4) > .card:nth-child(2)',0.95,30,30,{drop:true}));}
// 4 SPREAD staff: attendance crop + title + laptop with the staff screen
{const m=mod('m-attendance',820);
 const A=plate(m,40,40,460,440);A.appendChild(z('#s-staff .row:nth-of-type(3) > .card:first-child',0.9,22,36,{drop:true}));
 const bk=document.createElement('div');bk.className='block sm';bk.style.cssText='left:40px;top:500px;width:460px;height:280px;padding:40px 44px';bk.innerHTML='<h3 style="font-size:40px">Attendance at a glance</h3><p style="font-size:20px">Present, absent and on leave for each college, in one bar.</p>';m.appendChild(bk);
 const B=plate(m,520,40,1040,740);B.appendChild(lap('#s-staff',0.8,26,70,600));}
// 5 DARK: four levels cascade
{const m=mod('m-weakest',860);const p=dark(m,40,40,1520,780);
 dtxt(p,80,90,'The weakest row is named at every level','The same line opens each drawer, with its gap to target.');p.lastChild.style.maxWidth='470px';p.lastChild.querySelector('h3').style.fontSize='46px';
 const a=lap('#s-d2',0.58,640,60,470);a.style.filter='drop-shadow(0 30px 40px rgba(0,0,0,.4))';p.appendChild(a);
 const b=lap('#s-d3',0.58,900,290,470);b.style.filter='drop-shadow(0 30px 40px rgba(0,0,0,.45))';p.appendChild(b);
 p.appendChild(z('#s-d3 #lowline',0.62,80,520,{drop:true,w:700}));}
// 6 BENTO staff: dense
{const m=mod('m-staff',1000);
 const A=plate(m,40,40,1000,600);A.appendChild(z('#s-staff .main > .row:nth-of-type(2)',1.04,22,36,{drop:false}));
 A.appendChild(z('#s-staff .row:nth-of-type(3) > .card:first-child',1.0,22,230,{drop:true}));A.appendChild(z('#s-staff .row:nth-of-type(3) > .card:nth-child(2)',0.92,660,230,{drop:true}));
 const B=plate(m,1060,40,500,600);
 B.appendChild(z('#s-staff .row:nth-of-type(2) > .card:nth-child(3)',1.5,80,36,{drop:true}));B.appendChild(z('#s-staff .row:nth-of-type(2) > .card:nth-child(4)',1.5,80,214,{drop:true}));B.appendChild(z('#s-staff .row:nth-of-type(2) > .card:nth-child(5)',1.5,80,392,{drop:true}));
 const C=plate(m,40,660,860,300);C.appendChild(z('#s-staff .main > .card:last-child',0.9,28,36,{drop:true}));
 const D=plate(m,920,660,640,300);
 D.appendChild(z('#s-staff .row:nth-of-type(2) > .card:nth-child(2)',1.5,34,40,{drop:true}));D.appendChild(z('#s-staff .row:nth-of-type(2) > .card:nth-child(1)',1.5,334,40,{drop:true}));}
// 7 SPREAD mirrored: laptop with the college drawer, banner crops, title
{const m=mod('m-totals',820);
 const A=plate(m,520,40,1040,740);A.appendChild(lap('#s-d2',0.8,26,70,600));
 const B=plate(m,40,40,460,440);
 B.appendChild(z('#s-d2 .hero',0.9,24,30,{drop:true}));B.appendChild(z('#s-d3 .hero',0.9,24,228,{drop:true}));
 const bk=document.createElement('div');bk.className='block sm';bk.style.cssText='left:40px;top:500px;width:460px;height:280px;padding:40px 44px';bk.innerHTML='<h3 style="font-size:40px">Totals for the level you open</h3><p style="font-size:20px">Each drawer shows its own received, expected and collection, not the group figures.</p>';m.appendChild(bk);}
// 8 COLOUR bento: full-bleed colour plates
{const m=mod('m-colour',900);
 const sp=(l,t,w,h,bg,name,hex,light)=>{const d=document.createElement('div');d.className='swp';d.style.cssText=`left:${l}px;top:${t}px;width:${w}px;height:${h}px;background:${bg};color:${light?'#1B2340':'#fff'};box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)`;d.innerHTML=`<div style="position:absolute;left:44px;bottom:38px"><div style="font:600 30px Figtree">${name}</div><div style="font:500 22px Figtree;opacity:.7;margin-top:4px">${hex}</div></div>`;m.appendChild(d);return d};
 const nv=sp(40,40,740,420,'linear-gradient(135deg,#08153A,#12326E)','Navy','#08153A to #12326E');nv.appendChild(z('#s-fin .hero',0.74,44,50,{drop:true}));
 const bl=sp(800,40,360,420,'#4F86E8','Blue','#4F86E8');bl.appendChild(cmp(`<div class="tabs" style="display:flex;flex-direction:column;gap:6px"><span class="on" style="padding:8px 16px">Programmes</span><span style="padding:8px 16px;background:#fff;color:#12326E;border-radius:8px">Fee breakdown</span></div>`,1.5,44,50));
 const cv=sp(1180,40,380,420,'#F5F6F9','Canvas','#F5F6F9',true);cv.appendChild(cmp(`<div style="display:flex;flex-direction:column;gap:14px;align-items:flex-start"><span class="chip ok">83.8%</span><span class="chip warn">72.7%</span><span class="chip bad">55.9%</span></div>`,1.7,40,40));
 const st=(l,c,bg,name,hex,pct,chip)=>{const d=sp(l,480,500,380,bg,name,hex);d.style.background=bg;d.appendChild(cmp(`<span class="chip ${chip}" style="background:#fff">${pct}%</span>`,1.8,44,44));
   d.appendChild(cmp(`<div class="mini" style="background:rgba(255,255,255,.35);width:260px"><b style="width:${pct}%;background:#fff"></b><u style="left:80%;background:#fff;opacity:.9"></u></div>`,1.6,44,150));};
 st(40,0,'#12805C','On target','#12805C, 80% and above',84,'ok');st(560,0,'#D9910A','Near target','#D9910A, 70% to 79%',73,'warn');st(1080,0,'#D92D20','Below target','#D92D20, under 70%',56,'bad');
 m.lastChild.style.width='480px';}
// 9 PROCESS: earlier layouts next to the redesign
{const m=mod('m-process',860);
 const A=plate(m,40,40,900,780);
 const img=(src,l,t,w)=>{const i=document.createElement('img');i.src=src;i.style.cssText=`position:absolute;left:${l}px;top:${t}px;width:${w}px;border-radius:22px;box-shadow:0 18px 40px -22px rgba(30,30,80,.35)`;A.appendChild(i)};
 img(IMG+'earlier-finance.webp',40,120,420);img(IMG+'earlier-drawer-college.webp',480,120,400);img(IMG+'earlier-drawer.webp',480,450,400);
 const l=document.createElement('div');l.className='lbl2';l.style.cssText='left:50px;top:54px';l.textContent='Earlier layouts';A.appendChild(l);
 const B=plate(m,960,40,600,780);B.appendChild(lap('#s-d3',0.46,12,170,368,0,0));
 const l2=document.createElement('div');l2.className='lbl2';l2.style.cssText='left:50px;top:54px';l2.textContent='Redesign';B.appendChild(l2);}
};
</script>
