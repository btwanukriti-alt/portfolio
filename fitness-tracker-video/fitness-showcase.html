<script>
// Fitness app showcase, 20s loop. Same stage, type, cursor and motion system as the College
// Management cut (public/showcase/college-management.html); the product UI is rebuilt as vector
// phone screens from the Zync Figma section (393:169642). Every frame is a pure function of t.
const { useState, useEffect, useRef } = React
const h = React.createElement
const DURATION = 20, W = 1920, H = 1080
const FONT = "'Public Sans', system-ui, sans-serif"
const APP = "'Poppins', system-ui, sans-serif"

// Studio + caption tokens (College Management) and app tokens (Zync).
const C = {
  ink: '#1C252E', sub: '#637381', mute: '#919EAB', line: '#E9EDF2', blue: '#1877F2',
  green: '#00A76F', greenL: '#5BE49B', amber: '#FFAB00',
}
const Z = {
  ink: '#111111', sub: '#6F6F7A', mute: '#A3A3AE', bg: '#F5F4FA', card: '#FFFFFF', line: '#ECEBF3',
  purple: '#6650D0', purpleL: '#EEEAFE', purpleMid: '#9E8CF0', pink: '#F2577A', pinkL: '#FDE3EA',
  water: '#5B8DEF', waterL: '#E4ECFD', sleep1: '#3D3B8E', sleep2: '#A21CC4', green: '#1F9D63',
  teal: '#55CFA8', amber: '#FFB800', violet: '#C85BD3',
}

const clamp = (e, a = 0, b = 1) => Math.max(a, Math.min(b, e))
const ease = (e) => (e < 0.5 ? 4 * e * e * e : 1 - Math.pow(-2 * e + 2, 3) / 2)
const ramp = (e, a, b) => ease(clamp((e - a) / (b - a)))
const lerp = (a, b, k) => a + (b - a) * k
const seq = (e, k) => {
  if (e <= k[0][0]) return k[0][1]
  for (let n = 0; n < k.length - 1; n++) {
    const [i, o] = k[n], [a, s] = k[n + 1]
    if (e <= a) return lerp(o, s, ramp(e, i, a))
  }
  return k[k.length - 1][1]
}
const env = (e, s, end, i = 0.6, o = 0.5) => {
  const a = ramp(e, s, s + i), b = ramp(e, end - o, end)
  return { op: a * (1 - b), y: (1 - a) * 60 - b * 30, tilt: (1 - a) * 6, i: a, o: b }
}
const fmt = (n) => Math.round(n).toLocaleString('en-US')

// ---------- Studio vocabulary (unchanged from College Management) ----------

function Studio({ t }) {
  const a = Math.sin(t * 0.22), b = Math.cos(t * 0.17)
  const blob = (x, y, w, hh, c) => h('div', { style: { position: 'absolute', left: x, top: y, width: w, height: hh, borderRadius: '50%', background: `radial-gradient(closest-side, ${c}, transparent)` } })
  return h('div', { style: { position: 'absolute', inset: 0, overflow: 'hidden', background: 'linear-gradient(180deg, #F7F9FC 0%, #EEF3FA 100%)' } },
    blob(-260 + a * 70, -340 + b * 40, 1300, 1000, 'rgba(24,119,242,0.20)'),
    blob(1050 - a * 80, -260 + a * 30, 1200, 900, 'rgba(0,184,217,0.14)'),
    blob(520 + b * 90, 640, 1100, 760, 'rgba(91,140,255,0.12)'),
    blob(-200, 700 + a * 30, 900, 700, 'rgba(0,167,111,0.06)'),
    h('div', { style: { position: 'absolute', left: 260, top: 160, width: 1400, height: 900, borderRadius: '50%', background: 'radial-gradient(closest-side, rgba(255,255,255,0.85), rgba(255,255,255,0))' } }),
    h('div', { style: { position: 'absolute', inset: 0, backgroundImage: 'radial-gradient(rgba(11,42,91,0.16) 1.1px, transparent 1.2px)', backgroundSize: '28px 28px', WebkitMaskImage: 'radial-gradient(60% 55% at 50% 55%, rgba(0,0,0,0.55), transparent 100%)', maskImage: 'radial-gradient(60% 55% at 50% 55%, rgba(0,0,0,0.55), transparent 100%)' } }),
    h('svg', { width: W, height: H, style: { position: 'absolute', inset: 0, opacity: 0.05, mixBlendMode: 'multiply' } },
      h('filter', { id: 'gr' }, h('feTurbulence', { type: 'fractalNoise', baseFrequency: '0.85', numOctaves: '2', seed: '3' })),
      h('rect', { width: W, height: H, filter: 'url(#gr)' })),
  )
}

function Headline({ t, s, e, eyebrow, title }) {
  const a = ramp(t, s, s + 0.6), b = ramp(t, s + 0.12, s + 0.75), o = ramp(t, e - 0.45, e)
  return h('div', { style: { position: 'absolute', top: 70, left: 0, right: 0, textAlign: 'center', fontFamily: FONT } },
    h('div', { style: { fontSize: 20, letterSpacing: '0.16em', textTransform: 'uppercase', fontWeight: 600, color: C.sub, opacity: a * (1 - o), transform: `translateY(${(1 - a) * 20 - o * 16}px)` } }, eyebrow),
    h('div', { style: { marginTop: 14, fontSize: 60, fontWeight: 600, letterSpacing: '-0.03em', color: '#0B1B33', opacity: b * (1 - o), transform: `translateY(${(1 - b) * 30 - o * 20}px)` } }, title),
  )
}

function Cursor({ t, keys, clicks, show }) {
  const x = seq(t, keys.map((k) => [k[0], k[1]])), y = seq(t, keys.map((k) => [k[0], k[2]]))
  let s = 1
  clicks.forEach((c) => {
    const g = t - c
    if (g > -0.12 && g < 0.22) s = Math.min(s, g < 0 ? 1 - ((g + 0.12) / 0.12) * 0.18 : 0.82 + (g / 0.22) * 0.18)
  })
  const rings = clicks.map((c, i) => {
    const g = t - c
    if (g < 0 || g > 0.6) return null
    const k = ease(g / 0.6)
    return h('circle', { key: i, cx: 6, cy: 4, r: 8 + k * 26, fill: 'none', stroke: 'rgba(24,119,242,0.5)', strokeWidth: 2, opacity: 1 - k })
  })
  return h('svg', { width: 80, height: 80, style: { position: 'absolute', left: x - 6, top: y - 4, opacity: show, overflow: 'visible', zIndex: 50, transform: `scale(${s})`, transformOrigin: '6px 4px', filter: 'drop-shadow(0 6px 10px rgba(0,0,0,0.28))' } },
    rings,
    h('path', { d: 'M6 4 L6 34 L14 26 L20 40 L26 37 L20 24 L31 24 Z', fill: '#fff', stroke: '#111', strokeWidth: '1.6', strokeLinejoin: 'round' }),
  )
}

function Callout({ t, s, e, x, y, side = 'left', w = 330, pad = '22px 24px', children }) {
  const a = ramp(t, s, s + 0.6), o = ramp(t, e - 0.45, e), dx = (1 - a) * (side === 'left' ? -40 : 40)
  return h('div', { style: { position: 'absolute', left: x, top: y, width: w, opacity: a * (1 - o), zIndex: 40, transform: `translate(${dx}px, ${(1 - a) * 30 - o * 24}px)`, fontFamily: APP, color: Z.ink, background: 'rgba(255,255,255,0.96)', borderRadius: 20, padding: pad, boxSizing: 'border-box', border: '1px solid rgba(255,255,255,0.9)', boxShadow: '0 30px 60px -12px rgba(11,42,91,0.28), 0 8px 18px rgba(11,42,91,0.08)' } }, children)
}

// Dashed + drawn connector between two points, as in the Fee collection scene.
function Link({ k, op = 1, from: [x1, y1], to: [x2, y2], bend = 70 }) {
  const d = `M${x1},${y1} C${x1 + bend},${y1} ${x2 - bend},${y2} ${x2},${y2}`
  return h('svg', { width: W, height: H, style: { position: 'absolute', inset: 0, opacity: op, zIndex: 30, pointerEvents: 'none' } },
    h('path', { d, fill: 'none', stroke: C.blue, strokeWidth: 2, strokeDasharray: '6 6', opacity: k }),
    h('path', { d, fill: 'none', stroke: C.blue, strokeWidth: 2.5, pathLength: 1, strokeDasharray: 1, strokeDashoffset: 1 - k }),
    h('circle', { cx: x1, cy: y1, r: 5 * k, fill: C.blue }),
    h('circle', { cx: x2, cy: y2, r: 5 * k, fill: C.blue }),
  )
}

// ---------- App vocabulary (Zync, rebuilt as vectors) ----------

const ICON = {

  plus: 'M12 5v14M5 12h14',
  plusBox: 'M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM12 8v8M8 12h8',
  card: 'M5 3h14a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM12 11a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM8 17h8',

}
const Icon = ({ n, c = Z.sub, s = 20, w = 1.8, fill = 'none' }) =>
  h('svg', { width: s, height: s, viewBox: '0 0 24 24', fill, stroke: c, strokeWidth: w, strokeLinecap: 'round', strokeLinejoin: 'round', style: { flexShrink: 0, display: 'block' } }, h('path', { d: ICON[n] }))

const Avatar = ({ s = 40, initials = 'SS', grad = ['#7C6AE6', '#4C3DB8'], fs }) =>
  h('div', { style: { width: s, height: s, borderRadius: s / 2, background: `linear-gradient(135deg,${grad[0]},${grad[1]})`, color: '#fff', fontSize: fs || s * 0.36, fontWeight: 600, display: 'grid', placeItems: 'center', flexShrink: 0 } }, initials)

// Gym badge from the Figma gym selector (yellow face with a dumbbell), drawn as a vector.
const GymBadge = ({ s = 34 }) =>
  h('div', { style: { width: s, height: s, borderRadius: s / 2, background: Z.purpleL, display: 'grid', placeItems: 'center', overflow: 'hidden' } },
    h('div', { style: { width: s * 0.72, height: s * 0.72, borderRadius: s, background: '#FFC93C', marginTop: s * 0.32, display: 'grid', placeItems: 'start center' } },
      h('div', { style: { marginTop: -s * 0.08 } }, h(Icon, { n: 'dumbbell', c: '#1A1A1A', s: s * 0.5, w: 2.6 }))))

// Soft illustrated stand-in for workout photography.
const Photo = ({ w, h: hh, r = 14, hue = 0, icon = 'stretch', children }) => {
  const g = [['#E9E3FF', '#FFE1EC'], ['#E0ECFF', '#E9E3FF'], ['#FFE9DA', '#F0E3FF'], ['#DFF6EE', '#E3E8FF']][hue % 4]
  return h('div', { style: { width: w, height: hh, borderRadius: r, position: 'relative', overflow: 'hidden', background: `linear-gradient(135deg,${g[0]},${g[1]})`, flexShrink: 0 } },
    h('div', { style: { position: 'absolute', right: -hh * 0.1, bottom: -hh * 0.15, opacity: 0.55 } }, h(Icon, { n: icon, c: Z.purple, s: hh * 0.95, w: 1.1 })),
    h('div', { style: { position: 'absolute', left: 0, right: 0, bottom: 0, height: '30%', background: 'linear-gradient(0deg,rgba(102,80,208,0.10),transparent)' } }),
    children)
}

const Tag = ({ c, bg, children, fs = 11 }) => h('span', { style: { padding: '3px 9px', borderRadius: 8, background: bg, color: c, fontSize: fs, fontWeight: 500, whiteSpace: 'nowrap' } }, children)
const Pill = ({ children }) => h('span', { style: { position: 'absolute', left: 10, top: 10, padding: '3px 10px', borderRadius: 10, background: '#DCF7EC', color: '#1F8A5B', fontSize: 11, fontWeight: 500 } }, children)

// Donut arc as an SVG path from angle a0 to a1 (degrees, 0 = top).
const arc = (cx, cy, r, a0, a1) => {
  const p = (a) => [cx + r * Math.sin((a * Math.PI) / 180), cy - r * Math.cos((a * Math.PI) / 180)]
  const [x0, y0] = p(a0), [x1, y1] = p(a1)
  return `M${x0},${y0} A${r},${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1},${y1}`
}

// Device frame: 390 x 844 screen in a slim bezel, scaled. Children use screen coordinates.
const PS = 0.88, BZ = 11
const PW = (390 + BZ * 2) * PS, PH = (844 + BZ * 2) * PS
const pt = (left, top, x, y) => [left + (BZ + x) * PS, top + (BZ + y) * PS]
function Phone({ x, y, op = 1, dy = 0, tilt = 0, z = 10, children }) {
  return h('div', { style: { position: 'absolute', left: x, top: y, width: 390 + BZ * 2, height: 844 + BZ * 2, transformOrigin: '0 0', transform: `translateY(${dy}px) scale(${PS}) perspective(1600px) rotateX(${tilt}deg)`, opacity: op, zIndex: z } },
    h('div', { style: { position: 'absolute', inset: 0, borderRadius: 62, background: '#15141B', boxShadow: '0 50px 90px -24px rgba(11,42,91,0.38), 0 12px 26px rgba(11,42,91,0.10), inset 0 0 0 1.5px #3A3946' } }),
    h('div', { style: { position: 'absolute', left: BZ, top: BZ, width: 390, height: 844, borderRadius: 52, overflow: 'hidden', background: Z.bg, fontFamily: APP, color: Z.ink } },
      children,
      h(StatusBar),
      h('div', { style: { position: 'absolute', left: 140, top: 10, width: 110, height: 32, borderRadius: 16, background: '#000', zIndex: 20 } }),
      h('div', { style: { position: 'absolute', left: 128, bottom: 8, width: 134, height: 5, borderRadius: 3, background: '#111', zIndex: 20 } })))
}
const StatusBar = () =>
  h('div', { style: { position: 'absolute', left: 0, right: 0, top: 0, height: 50, display: 'flex', alignItems: 'center', padding: '6px 34px 0 40px', boxSizing: 'border-box', fontSize: 15, fontWeight: 600, zIndex: 19, fontFamily: FONT } },
    '9:41',
    h('div', { style: { marginLeft: 'auto', display: 'flex', gap: 6, alignItems: 'center' } },
      h('svg', { width: 18, height: 12 }, [3, 6, 9, 12].map((hh, i) => h('rect', { key: i, x: i * 4.6, y: 12 - hh, width: 3.2, height: hh, rx: 1, fill: '#111' }))),
      h('div', { style: { width: 25, height: 12, borderRadius: 4, border: '1.5px solid rgba(0,0,0,0.4)', padding: 1.5, boxSizing: 'border-box' } }, h('div', { style: { width: '80%', height: '100%', borderRadius: 2, background: '#111' } }))))

function NavBar({ active, plus }) {
  const items = [['home', 'Home'], ['plusBox', 'Log'], ['card', 'Gym'], ['dumbbell', 'Workout']]
  return h('div', { style: { position: 'absolute', left: 0, right: 0, bottom: 0, height: 86, background: '#fff', borderTop: `1px solid ${Z.line}`, display: 'flex', alignItems: 'flex-start', justifyContent: 'space-around', paddingTop: 14, boxSizing: 'border-box', zIndex: 12 } },
    items.map(([n, l]) => {
      const on = l === active
      return h('div', { key: l, style: { display: 'flex', alignItems: 'center', gap: 6, padding: on ? '8px 16px' : '8px 10px', borderRadius: 20, background: on ? Z.purpleL : 'transparent', transform: l === 'Log' && plus ? `scale(${plus})` : 'none' } },
        h(Icon, { n, c: on ? Z.purple : '#2A2A33', s: 22, w: on ? 2 : 1.7 }),
        on && h('span', { style: { fontSize: 15, fontWeight: 500, color: Z.purple } }, l))
    }))
}

const CardBox = ({ style, children }) => h('div', { style: { background: Z.card, borderRadius: 18, boxShadow: '0 1px 2px rgba(17,17,17,0.03)', ...style } }, children)

// ---------- Screens ----------

// Homepage (393:169995): greeting, gym, daily attendance, calories + macros.
function HomeScreen({ t, sheet, waterTap, plus }) {
  const burned = 882 * ramp(t, 3.9, 4.9)
  return h('div', { style: { position: 'absolute', inset: 0 } },
    h('div', { style: { position: 'absolute', left: 22, top: 58, right: 22, display: 'flex', alignItems: 'center', gap: 14 } },
      h(Avatar, { s: 42 }), h('div', { style: { fontSize: 22, fontWeight: 600 } }, 'Hi, Steve!'),

    h('div', { style: { position: 'absolute', left: 30, top: 118, fontSize: 16, fontWeight: 500 } }, 'Current Gym'),
    h('div', { style: { position: 'absolute', left: 18, right: 18, top: 146, height: 52, borderRadius: 26, background: '#fff', border: `1px solid ${Z.line}`, display: 'flex', alignItems: 'center', gap: 12, padding: '0 18px 0 10px' } },

    // Daily Fitness Attendance
    h('div', { style: { position: 'absolute', left: 18, right: 18, top: 212, height: 112, borderRadius: 20, overflow: 'hidden', background: 'linear-gradient(120deg,#8E78F0,#7559E3)', color: '#fff', padding: '16px 20px', boxSizing: 'border-box' } },
      h('div', { style: { position: 'absolute', right: -50, top: -30, width: 190, height: 190, borderRadius: 95, border: '18px solid rgba(255,255,255,0.10)' } }),
      h('div', { style: { fontSize: 16, fontWeight: 600 } }, 'Daily Fitness Attendance'),
      h('div', { style: { display: 'flex', alignItems: 'center', gap: 14, marginTop: 10 } },
        h('div', { style: { width: 44, height: 50, borderRadius: 14, background: '#fff', color: '#2B2470', display: 'grid', placeItems: 'center', lineHeight: 1.05, textAlign: 'center' } },
          h('div', null, h('div', { style: { fontSize: 17, fontWeight: 600 } }, '19'), h('div', { style: { fontSize: 11 } }, 'Feb'))),
        h('div', { style: { fontSize: 13, opacity: 0.92, lineHeight: 1.35 } }, 'Record your workout', h('br'), 'and stay consistent.'),
        h('div', { style: { marginLeft: 'auto', padding: '7px 12px', borderRadius: 9, background: '#fff', color: Z.ink, fontSize: 13, fontWeight: 600, display: 'flex', gap: 5, alignItems: 'center' } }, 'Done', h(Icon, { n: 'check', c: Z.ink, s: 13, w: 2.4 })))),
    // Calories + macro
    h(CardBox, { style: { position: 'absolute', left: 18, right: 18, top: 338, height: 340, padding: '18px 22px', boxSizing: 'border-box' } },
      h('div', { style: { display: 'flex', alignItems: 'center' } }, h('div', { style: { fontSize: 16, fontWeight: 600 } }, 'Calories'),
        h('div', { style: { marginLeft: 'auto', width: 20, height: 20, borderRadius: 10, background: Z.purple, display: 'grid', placeItems: 'center' } }, h(Icon, { n: 'plus', c: '#fff', s: 13, w: 3 }))),
      h('div', { style: { display: 'flex', alignItems: 'center', marginTop: 10 } },
        h('svg', { width: 130, height: 130 },
          h('circle', { cx: 65, cy: 65, r: 56, fill: 'none', stroke: '#DADAE2', strokeWidth: 4 }),
          h('path', { d: arc(65, 65, 56, 200, 200 + 160 * ramp(t, 3.9, 4.9) + 0.01), fill: 'none', stroke: Z.pink, strokeWidth: 9, strokeLinecap: 'round' })),
        h('div', { style: { position: 'absolute', left: 22, width: 130, textAlign: 'center', marginTop: 4 } },
          h('div', { style: { display: 'flex', justifyContent: 'center' } }, h(Icon, { n: 'flame', c: Z.pink, s: 20, fill: Z.pink, w: 1 })),

          h('div', { style: { fontSize: 13, color: Z.sub } }, 'Consumed'), h('div', { style: { fontSize: 19, fontWeight: 600 } }, fmt(1385 * ramp(t, 3.9, 4.9)), ' cal'),
          h('div', { style: { fontSize: 10, color: Z.mute, marginBottom: 12 } }, h('span', { style: { color: '#E5484D' } }, '5%↓'), ' intake than last week'),

      h('div', { style: { height: 1, background: Z.line, margin: '12px -22px 12px' } }),
      h('div', { style: { fontSize: 16, fontWeight: 600 } }, 'Macro'),
      h('div', { style: { display: 'flex', justifyContent: 'space-between', marginTop: 10, padding: '0 6px' } },

const SCENE_TICKS = [3.6, 8, 12.6, 17.2]

  const [t, setT] = useState(0), [playing, setPlaying] = useState(true), [bare, setBare] = useState(false), [s, setS] = useState(1)
  const tr = useRef(0), pr = useRef(true), last = useRef(null)
  useEffect(() => { tr.current = t }, [t])
  useEffect(() => { pr.current = playing }, [playing])
  useEffect(() => {
    const fit = () => setS(Math.min(window.innerWidth / W, (window.innerHeight - (bare ? 0 : 64)) / H))
    fit(); window.addEventListener('resize', fit)
    return () => window.removeEventListener('resize', fit)
  }, [bare])
  useEffect(() => {

    const tick = (now) => {

        let n = tr.current + dt
        if (n >= DURATION) { n = DURATION; setPlaying(false) }
        tr.current = n; setT(n)

      raf = requestAnimationFrame(tick)

    return () => cancelAnimationFrame(raf)
  }, [])
  useEffect(() => {
    const key = (e) => {
      if (e.code === 'Space') { e.preventDefault(); if (tr.current >= DURATION) { tr.current = 0; setT(0) } setPlaying((p) => !p) }

      if (e.key === 'ArrowRight') { const n = Math.min(DURATION, tr.current + 1); tr.current = n; setT(n) }
      if (e.key === 'ArrowLeft') { const n = Math.max(0, tr.current - 1); tr.current = n; setT(n) }

    window.addEventListener('keydown', key)

  }, [])

  return h('div', { style: { position: 'fixed', inset: 0, background: '#000', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', fontFamily: FONT } },
    h('div', { style: { width: W * s, height: H * s, position: 'relative', overflow: 'hidden' } },

        h('div', { style: { width: `${(t / DURATION) * 100}%`, height: '100%', borderRadius: 3, background: '#1877F2' } }),
        SCENE_TICKS.map((k) => h('div', { key: k, style: { position: 'absolute', left: `${(k / DURATION) * 100}%`, top: -3, width: 2, height: 12, background: '#6b7a93' } }))),

}
